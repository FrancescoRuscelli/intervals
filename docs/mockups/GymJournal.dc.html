<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journal with gym days</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 12px 4px 20px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Journal</h1>
    <span style="font-size: 15px; font-weight: 600; padding-right: 8px">November 2026</span>
  </header>

  <div role="group" aria-label="Show" style="display: flex; gap: 6px; padding: 8px 16px 0">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
      <button aria-pressed="{{f.on}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{f.dot}}"></span>{{f.label}}</button>
    </sc-for>
  </div>

  <div style="margin: 12px 16px 0; padding: 10px 8px 12px; border-radius: 18px; background: #1A1C21">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 600; color: #9AA0AA; padding-bottom: 6px">
      <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
        <div style="height: 42px; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{c.real}}" hint-placeholder-val="{{ true }}">
            <button aria-label="{{c.label}}" style="width: 40px; height: 40px; padding: 0; border-radius: 20px; border: {{c.ring}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; font-weight: {{c.fw}}">
              <span style="line-height: 1">{{c.n}}</span>
              <span style="display: flex; gap: 2px; height: 5px">
                <sc-for list="{{c.dots}}" as="d" hint-placeholder-count="1">
                  <span style="width: 5px; height: 5px; border-radius: 3px; background: {{d.c}}"></span>
                </sc-for>
              </span>
            </button>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 0">
    <span style="font-size: 13px; font-weight: 600; color: #9AA0AA; padding: 0 4px">Sunday 15 November</span>
    <a href="GymFinish.dc.html" style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #1A1C21; color: inherit; text-decoration: none">
      <span style="width: 6px; border-radius: 3px; background: #7C3AED"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 700">Gym · Pull</span><span style="font-size: 12px; color: #9AA0AA">48 min · 1 PR</span></span>
        <span style="font-size: 13px; color: #C9CDD3">Pull Up +30 × 5, 5, 4 · Band One Arm Pull Up R 🟢 × 3</span>
        <span style="font-size: 12px; color: #9AA0AA; font-style: italic">"spalla un po' rigida"</span>
      </span>
    </a>
    <a href="Finish.dc.html" style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #1A1C21; color: inherit; text-decoration: none">
      <span style="width: 6px; border-radius: 3px; background: #E91E63"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 700">Intervals · Hangboard repeaters</span><span style="font-size: 12px; color: #9AA0AA">22 min</span></span>
        <span style="font-size: 13px; color: #C9CDD3">6 of 6 rounds · 20 mm +10 kg</span>
      </span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const GYM = '#7C3AED', INT = '#E91E63';
    const filters = [
      { label: 'All', on: 'true', dot: 'transparent' },
      { label: 'Gym', on: 'false', dot: GYM },
      { label: 'Intervals', on: 'false', dot: INT }
    ].map((f) => Object.assign(f, f.on === 'true'
      ? { bg: '#2A2340', border: '#7C3AED', fg: '#C4B1FF' }
      : { bg: '#111216', border: '#2A2D34', fg: '#C9CDD3' }));
    // Nov 1 2026 is a Sunday; real gym days from the FitNotes data, plus some interval days
    const gym = [2, 3, 4, 6, 8, 9, 11, 13, 15];
    const ints = [2, 4, 9, 15, 16];
    const today = 17, selected = 15;
    const cells = [];
    for (let i = 0; i < 6; i++) cells.push({ real: false });
    for (let d = 1; d <= 30; d++) {
      const sel = d === selected, dots = [];
      if (gym.includes(d)) dots.push({ c: sel ? '#FFFFFF' : GYM });
      if (ints.includes(d)) dots.push({ c: sel ? '#FFFFFF' : INT });
      cells.push({
        real: true, n: d, dots,
        label: d + ' November' + (dots.length ? ', ' + dots.length + ' sessions' : ''),
        bg: sel ? '#3A2F5C' : 'transparent',
        fg: d > today ? '#6E747E' : '#F2F3F5',
        ring: d === today ? '2px solid #7C3AED' : '2px solid transparent',
        fw: dots.length || sel ? 700 : 500
      });
    }
    while (cells.length < 42) cells.push({ real: false });
    return { filters, cells };
  }
}
</script>
</body>
</html>
