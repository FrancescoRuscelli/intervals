<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout finished</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden">
  <header style="align-self: stretch; display: flex; justify-content: flex-end; padding: 12px 8px 0">
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>

  <svg role="img" aria-label="All 4 rounds done" width="230" height="230" viewBox="0 0 230 230" style="margin-top: 4px">
    <sc-for list="{{arcs}}" as="a" hint-placeholder-count="4">
      <path d="{{a.d}}" fill="none" stroke="{{t.accent}}" stroke-width="12" stroke-linecap="round"></path>
    </sc-for>
    <circle cx="115" cy="115" r="88" fill="{{t.accent}}"></circle>
    <path d="M78 117l25 25 50-52" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>

  <h1 style="margin: 18px 0 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 34px; font-weight: 700">Well done</h1>
  <span style="font-size: 16px; color: {{t.muted}}">hangboard 70% · completed</span>

  <div style="align-self: stretch; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 22px 16px 0">
    <div style="padding: 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; align-items: center"><span style="font-size: 12px; color: {{t.muted}}">Time</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600">5:25</span></div>
    <div style="padding: 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; align-items: center"><span style="font-size: 12px; color: {{t.muted}}">Rounds</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600">4/4</span></div>
    <div style="padding: 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; align-items: center"><span style="font-size: 12px; color: {{t.muted}}">Series</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600">28</span></div>
  </div>

  <label style="align-self: stretch; display: flex; flex-direction: column; gap: 6px; padding: 18px 16px 0">
    <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Note for the journal</span>
    <textarea rows="3" placeholder="How did it go?" style="resize: none; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 15px; padding: 12px 14px; outline: 0"></textarea>
  </label>

  <div style="flex: 1"></div>

  <div style="align-self: stretch; display: flex; gap: 10px; padding: 0 16px 28px">
    <button style="flex: 1; height: 54px; border: 0; border-radius: 14px; background: {{t.tint}}; color: {{t.accentText}}; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"></path></svg>Repeat
    </button>
    <button style="flex: 1.4; height: 54px; border: 0; border-radius: 14px; background: {{t.accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600">Save to journal</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = { bg: '#000000', surface: '#1A1C21', line: '#23262C', text: '#F2F3F5', muted: '#9AA0AA', accent: '#7C3AED', accentText: '#C4B1FF', tint: '#2A2340' };
    const light = { bg: '#F6F5FA', surface: '#FFFFFF', line: '#E2E0EA', text: '#17151F', muted: '#5E5A6B', accent: '#6D28D9', accentText: '#5B21B6', tint: '#EDE7FB' };
    const t = (this.props.mode ?? 'dark') === 'light' ? light : dark;
    const cx = 115, cy = 115, r = 108;
    const pt = (deg) => { const a = deg * Math.PI / 180; return (cx + r * Math.sin(a)).toFixed(2) + ' ' + (cy - r * Math.cos(a)).toFixed(2); };
    const arcs = [0, 1, 2, 3].map((i) => { const a0 = i * 90 + 8, a1 = i * 90 + 82; return { d: 'M' + pt(a0) + ' A' + r + ' ' + r + ' 0 0 1 ' + pt(a1) }; });
    return { t, arcs };
  }
}
</script>
</body>
</html>
