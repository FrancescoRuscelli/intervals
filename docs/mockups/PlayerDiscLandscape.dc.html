<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player, big disc landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: {{page.bg}}; color: {{page.text}}; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px; overflow: hidden">
  <div style="flex: none; position: relative; width: 382px; height: 382px; display: flex; align-items: center; justify-content: center">
    <svg role="img" aria-label="Round 2: series 3 of 7, hang, 3 seconds left" width="382" height="382" viewBox="0 0 382 382">
      <sc-for list="{{arcs}}" as="a" hint-placeholder-count="9">
        <path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="butt"></path>
      </sc-for>
      <circle cx="191" cy="191" r="160" fill="{{color}}"></circle>
      <circle cx="{{dot.x}}" cy="{{dot.y}}" r="11" fill="{{page.text}}" stroke="{{page.bg}}" stroke-width="4"></circle>
    </svg>
    <div style="position: absolute; display: flex; flex-direction: column; align-items: center; color: #14080C">
      <span style="font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px">hang</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 136px; font-weight: 600; line-height: 0.95; letter-spacing: -6px; font-variant-numeric: tabular-nums">0:03</span>
    </div>
  </div>

  <div style="flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 0 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 15px; font-weight: 600; color: {{page.muted}}">hangboard 70%</span>
      <div style="display: flex">
        <button aria-label="Sound on" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
        </button>
        <button aria-label="Stop workout" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500; color: {{page.muted}}">Round</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 44px; font-weight: 600; line-height: 1">2<span style="color: {{page.muted}}">/4</span></span></div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500; color: {{page.muted}}">Series</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 44px; font-weight: 600; line-height: 1">3<span style="color: {{page.muted}}">/7</span></span></div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500; color: {{page.muted}}">Left</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 44px; font-weight: 600; line-height: 1">3:33</span></div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px; background: {{page.card}}">
      <span style="font-size: 14px; font-weight: 500; color: {{page.muted}}">Next</span>
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #FFC107"></span>
      <span style="flex: 1; font-size: 28px; font-weight: 700">rest</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 600">0:05</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 32px">
      <button aria-label="Previous series" style="width: 56px; height: 56px; border: 0; border-radius: 28px; background: {{page.ctl}}; color: {{page.ctlText}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13a.8.8 0 0 1-1.2.7L9.5 12.7a.8.8 0 0 1 0-1.4l9.3-6.5a.8.8 0 0 1 1.2.7z"></path></svg>
      </button>
      <button aria-label="Pause" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: {{page.main}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"></rect><rect x="14" y="4.5" width="4" height="15" rx="1"></rect></svg>
      </button>
      <button aria-label="Next series" style="width: 56px; height: 56px; border: 0; border-radius: 28px; background: {{page.ctl}}; color: {{page.ctlText}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13a.8.8 0 0 0 1.2.7l9.3-6.5a.8.8 0 0 0 0-1.4L5.2 4.8A.8.8 0 0 0 4 5.5z"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"color":{"editor":"color","default":"#E91E63","options":["#E91E63","#FFC107","#03A9F4","#8BC34A"]},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const color = this.props.color ?? '#E91E63';
    const dark = { bg: '#000000', text: '#F2F3F5', muted: '#9AA0AA', card: '#1A1C21', ctl: '#1F2127', ctlText: '#F2F3F5', main: '#7C3AED', done: '#2A2D34' };
    const light = { bg: '#F6F5FA', text: '#17151F', muted: '#5E5A6B', card: '#FFFFFF', ctl: '#EDE7FB', ctlText: '#5B21B6', main: '#6D28D9', done: '#DEDBE7' };
    const page = (this.props.mode ?? 'dark') === 'light' ? light : dark;
    const series = [[5, '#E91E63'], [5, '#FFC107'], [5, '#E91E63'], [5, '#FFC107'], [5, '#E91E63'], [5, '#FFC107'], [5, '#E91E63'], [60, '', true]];
    const current = 2, doneFrac = 0.4;
    const cx = 191, cy = 191, r = 178, gap = 3;
    const total = series.reduce((s, x) => s + x[0], 0);
    const span = 360 - gap * series.length;
    const pt = (deg) => { const a = deg * Math.PI / 180; return { x: +(cx + r * Math.sin(a)).toFixed(2), y: +(cy - r * Math.cos(a)).toFixed(2) }; };
    const arc = (a0, a1) => { const p = pt(a0), q = pt(a1); return 'M' + p.x + ' ' + p.y + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + q.x + ' ' + q.y; };
    const arcs = [];
    let a = gap / 2, dot = pt(0);
    series.forEach(([d, c, brk], i) => {
      const len = span * d / total, end = a + len;
      if (i < current) arcs.push({ d: arc(a, end), c: page.done, w: 14 });
      else if (i === current) {
        const mid = a + len * doneFrac;
        arcs.push({ d: arc(a, mid), c: page.done, w: 14 });
        arcs.push({ d: arc(mid, end), c, w: 22 });
        dot = pt(mid);
      } else arcs.push({ d: arc(a, end), c: brk ? page.muted : c, w: brk ? 5 : 14 });
      a = end + gap;
    });
    return { page, color, arcs, dot };
  }
}
</script>
</body>
</html>
