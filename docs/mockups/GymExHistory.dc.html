<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym, exercise history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 0">
    <a href="GymToday.dc.html" aria-label="Back to today" style="width: 44px; height: 44px; border-radius: 22px; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 700">Deadlift</span>
    <a href="GymEditExercise.dc.html" aria-label="Edit exercise" style="width: 44px; height: 44px; border-radius: 22px; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"></path></svg>
    </a>
  </header>

  <nav role="tablist" style="display: flex; justify-content: center; gap: 22px; padding: 10px 16px 0; border-bottom: 1px solid #1A1C21">
    <a href="GymExercise.dc.html" role="tab" aria-selected="false" style="padding: 6px 2px 10px; border-bottom: 2px solid transparent; color: #6E747E; font-size: 14px; font-weight: 600; text-decoration: none">Log</a>
    <a href="GymExHistory.dc.html" role="tab" aria-selected="true" style="padding: 6px 2px 10px; border-bottom: 2px solid #7C3AED; color: #F2F3F5; font-size: 14px; font-weight: 600; text-decoration: none">History</a>
    <a href="GymHistory.dc.html" role="tab" aria-selected="false" style="padding: 6px 2px 10px; border-bottom: 2px solid transparent; color: #6E747E; font-size: 14px; font-weight: 600; text-decoration: none">Graph</a>
    <a href="GymRecords.dc.html" role="tab" aria-selected="false" style="padding: 6px 2px 10px; border-bottom: 2px solid transparent; color: #6E747E; font-size: 14px; font-weight: 600; text-decoration: none">Records</a>
  </nav>

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px 6px">
    <span style="font-size: 13px; color: #9AA0AA">55 workouts · 300 sets · since 25 Nov 2025</span>
    <span style="font-size: 12px; color: #C4B1FF; font-weight: 600">newest first</span>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
      <div style="padding: 12px 8px 12px 14px; border-radius: 18px; background: #1A1C21; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{d.day}}</span><span style="font-size: 12px; color: #9AA0AA">{{d.sum}}</span></span>
          <sc-if value="{{d.pr}}" hint-placeholder-val="{{ false }}"><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #FFC107; color: #1A1200; font-size: 11px; font-weight: 800; display: flex; align-items: center">PR</span></sc-if>
          <a href="GymSetNote.dc.html" aria-label="Edit {{d.day}}" style="width: 40px; height: 40px; border-radius: 12px; color: #9AA0AA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"></path></svg></a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-right: 6px; ">
          <sc-for list="{{d.sets}}" as="s" hint-placeholder-count="3">
            <span style="position: relative; height: 46px; min-width: 0; box-sizing: border-box; border-radius: 11px; background: {{s.bg}}; border: 1px solid {{s.border}}; color: {{s.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 10px; font-weight: 700; opacity: 0.75">{{s.lab}}</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: {{s.fs}}; font-weight: 600; white-space: nowrap">{{s.val}}</span><sc-if value="{{s.count}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -6px; right: -4px; height: 18px; padding: 0 6px; border-radius: 9px; background: #F2F3F5; color: #000000; font-size: 11px; font-weight: 800; display: flex; align-items: center">{{s.count}}</span></sc-if></span>
          </sc-for>
        </div>
        <sc-if value="{{d.note}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #C9CDD3; font-style: italic">{{d.note}}</span></sc-if>
        <span style="font-size: 11px; color: #6E747E">{{d.foot}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this._vals();
    const cells = (arr) => {
      const one = arr.map((s, i) => {
        let t = s.text ?? s.t, tag = '';
        if (t.endsWith(' ✓')) { t = t.slice(0, -2); tag = ' ✓'; }
        if (t.endsWith(' PR')) { t = t.slice(0, -3); tag = ' · PR'; }
        let side = '';
        const m = t.match(/^([LR]) (.*)$/);
        if (m) { side = m[1]; t = m[2]; }
        return { n: i + 1, side, tag, val: t.replace(' kg', ''), bg: s.bg, fg: s.fg };
      });
      // group identical sets that follow each other
      const out = [];
      one.forEach((s) => {
        const p = out[out.length - 1];
        if (p && !s.side && p.val === s.val && p.tag === s.tag && p.bg === s.bg) { p.to = s.n; p.k++; }
        else out.push(Object.assign({ to: s.n, k: 1 }, s));
      });
      return out.map((s) => ({
        lab: (s.side || (s.k > 1 ? s.n + '–' + s.to : String(s.n))) + s.tag,
        val: s.val, count: s.k > 1 ? '×' + s.k : '', bg: s.bg, fg: s.fg, border: s.bg,
        fs: [...s.val].length > 9 ? '12px' : '14px'
      }));
    };
    const cap = (boxes, max, total) => {
      if (!max || boxes.length <= max) return boxes;
      const shown = boxes.slice(0, max - 1);
      const hidden = total - shown.reduce((a, b) => a + (b.count ? parseInt(b.count.slice(1), 10) : 1), 0);
      return shown.concat([{ lab: 'tap to see', val: '+' + hidden + ' more', count: '', bg: 'transparent', fg: '#C4B1FF', border: '#3A2F5C', fs: '13px' }]);
    };
    v.days.forEach((e) => { e.sets = cap(cells(e.sets), 0, e.sets.length); });
    return v;
  }
  _vals() {
    const tabs = [['Log', 'GymExercise.dc.html'], ['History', 'GymExHistory.dc.html', true], ['Graph', 'GymHistory.dc.html'], ['Records', 'GymRecords.dc.html']]
      .map(([label, href, on]) => ({ label, href, on: on ? 'true' : 'false', bg: on ? '#2A2340' : 'transparent', fg: on ? '#C4B1FF' : '#9AA0AA', fw: on ? 700 : 600 }));
    const set = (t) => ({ t, bg: '#23262C', fg: '#E3E5E8' });
    const pr = (t) => ({ t: t + ' PR', bg: '#FFC107', fg: '#1A1200' });
    const many = (t, n) => Array.from({ length: n }, () => set(t));
    const imp = 'from FitNotes · rest not recorded';
    // your real Deadlift workouts
    return {
      tabs,
      days: [
        { day: 'Wednesday 11 November', sum: '4 sets · top 110 × 5 · 1,900 kg', pr: false, sets: [set('70 × 5'), set('90 × 5'), ...many('110 × 5', 2)], note: '', foot: imp },
        { day: 'Wednesday 4 November', sum: '5 sets · top 110 × 5 · 2,450 kg', pr: false, sets: [set('70 × 5'), set('90 × 5'), ...many('110 × 5', 3)], note: '', foot: imp },
        { day: 'Wednesday 28 October', sum: '11 sets · top 120 × 5 · 5,300 kg', pr: true, sets: [...many('60 × 5', 2), set('80 × 5'), set('90 × 5'), set('110 × 5'), pr('120 × 5'), ...many('120 × 5', 2), ...many('100 × 5', 3)], note: '', foot: imp },
        { day: 'Tuesday 20 October', sum: '6 sets · top 120 × 1 · 2,570 kg', pr: false, sets: [set('70 × 5'), set('90 × 5'), ...many('110 × 5', 3), set('120 × 1')], note: '', foot: imp },
        { day: 'Tuesday 13 October', sum: '3 sets · top 110 × 4 · 1,240 kg', pr: false, sets: [set('70 × 5'), set('90 × 5'), set('110 × 4')], note: '', foot: imp }
      ]
    };
  }
}
</script>
</body>
</html>
