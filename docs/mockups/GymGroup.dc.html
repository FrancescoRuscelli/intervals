<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym, group of exercises</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px">
    <a href="GymToday.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600">Group</span>
    <button aria-label="More options" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
    </button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 20px 14px">
    <label style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #9AA0AA">Name</span>
      <input value="Pull day" style="border: 0; border-bottom: 2px solid #7C3AED; outline: 0; background: transparent; color: #F2F3F5; font: inherit; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; padding: 4px 0 6px">
    </label>
    <span style="font-size: 13px; color: #9AA0AA">4 exercises · about 45 min · last done Friday</span>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
    <sc-for list="{{items}}" as="e" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 4px 0 14px; border-radius: 16px; background: #1A1C21">
        <span style="width: 30px; height: 30px; border-radius: 15px; background: #2A2340; color: #C4B1FF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{e.n}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">{{e.name}}</span>
          <span style="font-size: 12px; color: #9AA0AA">{{e.plan}}</span>
        </span>
        <span aria-hidden="true" style="width: 40px; display: flex; justify-content: center; color: #6E747E"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></span>
      </div>
    </sc-for>
    <button style="height: 52px; border: 2px dashed #2A2D34; border-radius: 16px; background: transparent; color: #C4B1FF; font-size: 15px; font-weight: 600">+ Add exercise (yours or new)</button>
    <span style="padding: 4px 4px 0; font-size: 12px; color: #9AA0AA">Drag to reorder · the plan (3 sets…) is just a reminder</span>
  </div>

  <div style="padding: 12px 16px 26px">
    <a href="GymToday.dc.html" style="height: 58px; border-radius: 18px; background: #7C3AED; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"></path></svg>Start Pull day
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { n: 1, name: 'Pull-ups', plan: '3 sets · weight · reps' },
        { n: 2, name: 'One-arm hang', plan: '4 sets · per side · weight · time' },
        { n: 3, name: 'Rows', plan: '3 sets · weight · reps' },
        { n: 4, name: 'Band face pulls', plan: '2 sets · band · reps' }
      ]
    };
  }
}
</script>
</body>
</html>
