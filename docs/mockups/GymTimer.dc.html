<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym, free timer for a timed set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 8px 0">
    <button aria-label="Back" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 17px; font-weight: 700">One Arm 90° Hold</span>
      <span style="font-size: 12px; color: #9AA0AA">Last · Sat · L −10 × 0:18 · R −10 × 0:21</span>
    </span>
    <span style="width: 44px; flex: none"></span>
  </header>

  <div role="group" aria-label="Side" style="display: flex; align-self: center; margin-top: 12px; padding: 3px; border-radius: 12px; background: #1A1C21">
    <button aria-pressed="true" style="width: 74px; height: 34px; border: 0; border-radius: 9px; background: #E91E63; color: #FFFFFF; font-size: 14px; font-weight: 700">Left</button>
    <button aria-pressed="false" style="width: 74px; height: 34px; border: 0; border-radius: 9px; background: transparent; color: #9AA0AA; font-size: 14px; font-weight: 700">Right</button>
    <button aria-pressed="false" style="width: 74px; height: 34px; border: 0; border-radius: 9px; background: transparent; color: #9AA0AA; font-size: 14px; font-weight: 700">Both</button>
  </div>

  <div style="padding: 12px 16px 0">
    <div style="padding: 10px; border-radius: 20px; background: #1A1C21; display: flex; align-items: center; gap: 12px">
      <span style="font-size: 12px; color: #9AA0AA; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; width: 60px">Weight</span>
      <span style="flex: 1; text-align: center; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700">−10<span style="font-size: 14px; color: #9AA0AA; margin-left: 4px">kg</span></span>
      <button aria-label="Weight minus 1" style="width: 52px; height: 44px; border: 0; border-radius: 12px; background: #2A2340; color: #C4B1FF; font-size: 22px; font-weight: 700">−</button>
      <button aria-label="Weight plus 1" style="width: 52px; height: 44px; border: 0; border-radius: 12px; background: #2A2340; color: #C4B1FF; font-size: 22px; font-weight: 700">+</button>
    </div>
  </div>

  <div style="margin: 12px 16px 0; padding: 16px; border-radius: 24px; background: {{card.bg}}; border: {{card.border}}; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span style="font-size: 12px; color: #9AA0AA; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">{{card.label}}</span>
    <span role="timer" aria-label="{{card.aria}}" style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 76px; font-weight: 700; line-height: 1; color: {{card.fg}}; font-variant-numeric: tabular-nums">{{card.big}}<span style="font-size: 30px; color: {{card.tenthFg}}">{{card.tenth}}</span></span>
    <span style="font-size: 13px; color: #9AA0AA; text-align: center">{{card.hint}}</span>

    <sc-if value="{{isStopped}}" hint-placeholder-val="{{ false }}">
      <span style="display: flex; gap: 10px; width: 100%">
        <button aria-label="One second less" style="flex: 1; height: 46px; border: 0; border-radius: 14px; background: #2A2340; color: #C4B1FF; font-size: 16px; font-weight: 700">− 1 s</button>
        <button aria-label="One second more" style="flex: 1; height: 46px; border: 0; border-radius: 14px; background: #2A2340; color: #C4B1FF; font-size: 16px; font-weight: 700">+ 1 s</button>
        <button style="flex: 1.2; height: 46px; border: 0; border-radius: 14px; background: #111216; color: #C9CDD3; font-size: 14px; font-weight: 600">Time again</button>
      </span>
    </sc-if>

    <sc-if value="{{showMain}}" hint-placeholder-val="{{ true }}">
      <button style="width: 100%; height: 72px; border: 0; border-radius: 22px; background: {{main.bg}}; color: #FFFFFF; font-size: 22px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 12px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="{{main.icon}}"></path></svg>{{main.label}}
      </button>
    </sc-if>
  </div>

  <div style="display: flex; padding: 12px 16px 0">
    <button style="flex: 1; height: 56px; border: 0; border-radius: 18px; background: {{log.bg}}; color: {{log.fg}}; font-size: 17px; font-weight: 700">{{log.label}}</button>
  </div>

  <section aria-label="Sets today" style="flex: 1; overflow: hidden; margin-top: 14px; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #9AA0AA; padding: 0 4px">Sets · 2</span>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
      <div style="padding: 10px; border-radius: 16px; background: rgba(233,30,99,0.14); border: 2px solid #E91E63; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #F48FB1">L · 1 set · next</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 16px; font-weight: 700">−10 kg</span>
        <span style="align-self: flex-start; min-width: 44px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 9px; background: #000000; border: 1px solid #2A2D34; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 15px; font-weight: 600">0:19</span>
      </div>
      <div style="padding: 10px; border-radius: 16px; background: #0E0F12; border: 1px solid #1A1C21; opacity: 0.55; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #5EEAD4">R · 1 set</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 16px; font-weight: 700">−10 kg</span>
        <span style="align-self: flex-start; min-width: 44px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 9px; background: #000000; border: 1px solid #2A2D34; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 15px; font-weight: 600">0:22</span>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["ready","running","stopped"],"default":"running"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'running';
    const PINK = '#E91E63', TEAL = '#00BFA5';
    const PLAY = 'M8 5.5v13a.8.8 0 0 0 1.2.7l10.2-6.5a.8.8 0 0 0 0-1.4L9.2 4.8A.8.8 0 0 0 8 5.5z';
    const STOP = 'M7 6h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z';
    const cards = {
      ready: { label: 'Time', big: '0:00', tenth: '', fg: '#6E747E', tenthFg: '#6E747E', hint: 'Start when you begin, Stop when you let go · or tap 0:00 to type it',
        bg: '#1A1C21', border: '1px solid #1A1C21', aria: 'Timer ready' },
      running: { label: 'Holding · left', big: '0:23', tenth: '.4', fg: '#FFFFFF', tenthFg: '#F48FB1', hint: 'last time 0:18 on the left · screen stays on',
        bg: 'rgba(233,30,99,0.12)', border: '2px solid #E91E63', aria: 'Running, 23 seconds' },
      stopped: { label: 'Time · measured', big: '0:24', tenth: '', fg: '#FFFFFF', tenthFg: '#FFFFFF', hint: 'rounded to the second · adjust if you started late',
        bg: '#1A1C21', border: '1px solid #2A2D34', aria: 'Stopped at 24 seconds' }
    };
    const mains = {
      ready: { label: 'START', bg: TEAL, icon: PLAY },
      running: { label: 'STOP', bg: PINK, icon: STOP },
      stopped: { label: '', bg: '', icon: '' }
    };
    const logs = {
      ready: { label: 'Log set · L', bg: '#2A2340', fg: '#6E747E' },
      running: { label: 'Log set · L (after Stop)', bg: '#2A2340', fg: '#6E747E' },
      stopped: { label: 'Log set · L · −10 × 0:24', bg: '#7C3AED', fg: '#FFFFFF' }
    };
    return {
      card: cards[state], main: mains[state], log: logs[state],
      isStopped: state === 'stopped', showMain: state !== 'stopped'
    };
  }
}
</script>
</body>
</html>
