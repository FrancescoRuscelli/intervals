<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom bar options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; padding: 18px 10px 6px 20px; gap: 4px">
    <span style="flex: 1; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700">{{o.title}}</span>
    <sc-for list="{{o.icons}}" as="i" hint-placeholder-count="2">
      <span style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #F2F3F5; background: {{i.bg}}">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.d}}"></path></svg>
      </span>
    </sc-for>
  </header>

  <sc-if value="{{o.segmented}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; margin: 6px 16px 0; padding: 4px; border-radius: 12px; background: #1A1C21">
      <span style="flex: 1; height: 36px; border-radius: 9px; background: #7C3AED; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center">Calendar</span>
      <span style="flex: 1; height: 36px; border-radius: 9px; color: #9AA0AA; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center">Stats</span>
    </div>
  </sc-if>

  <!-- a sketch of the screen behind -->
  <div style="flex: 1; overflow: hidden; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{o.body}}" as="b" hint-placeholder-count="4">
      <div style="height: {{b.h}}; border-radius: 16px; background: #1A1C21; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 600; color: #C9CDD3">{{b.t}}</span>
        <span style="height: 6px; width: {{b.w}}; border-radius: 3px; background: {{b.c}}"></span>
      </div>
    </sc-for>
  </div>

  <div style="padding: 10px 20px; font-size: 12px; color: #9AA0AA; line-height: 1.4">{{o.note}}</div>

  <nav style="display: grid; grid-template-columns: repeat({{o.cols}}, minmax(0, 1fr)); padding: 8px 8px 18px; border-top: 1px solid #23262C; background: #16181C">
    <sc-for list="{{o.tabs}}" as="t" hint-placeholder-count="3">
      <span style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.color}}; font-size: 13px; font-weight: {{t.fw}}">
        <span style="width: 60px; height: 32px; border-radius: 16px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg>
        </span>{{t.label}}
      </span>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["A 3 tabs","B 2 tabs","C 4 tabs"],"default":"A 3 tabs"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'A 3 tabs';
    const I = {
      timer: 'M12 8v5l3 2M9 2h6M12 4a9 9 0 1 0 0 18a9 9 0 0 0 0-18',
      gym: 'M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12',
      journal: 'M3.5 7.5a2.5 2.5 0 0 1 2.5-2.5h12a2.5 2.5 0 0 1 2.5 2.5v10a2.5 2.5 0 0 1-2.5 2.5h-12a2.5 2.5 0 0 1-2.5-2.5zM3.5 10h17M8 3v4M16 3v4',
      stats: 'M5 20v-8M12 20V5M19 20v-5',
      gear: 'M12 9a3 3 0 1 0 0 6a3 3 0 0 0 0-6M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1',
      search: 'M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14M20 20l-3.5-3.5'
    };
    const tab = (label, d, on) => ({ label, d, color: on ? '#C4B1FF' : '#9AA0AA', bg: on ? '#2A2340' : 'transparent', fw: on ? 700 : 600 });
    const icon = (d, on) => ({ d, bg: on ? '#2A2340' : 'transparent' });
    const journalBody = [
      { t: 'November 2026 · calendar with day strips', h: '230px', w: '70%', c: '#8BC34A' },
      { t: 'Gym · Legs  ·  13 sets · 1 PR', h: '74px', w: '85%', c: '#5B8DEF' },
      { t: 'Intervals · hangboard 70%', h: '74px', w: '60%', c: '#E91E63' }
    ];
    const O = {
      'A 3 tabs': {
        title: 'Journal', icons: [icon(I.gear)], segmented: true, cols: 3,
        tabs: [tab('Intervals', I.timer), tab('Gym', I.gym), tab('Journal', I.journal, true)],
        body: journalBody,
        note: 'A · 3 tabs. Stats is inside the Journal (Calendar | Stats). Settings is the ⚙ at the top right of every tab.'
      },
      'B 2 tabs': {
        title: 'Gym', icons: [icon(I.journal), icon(I.gear)], segmented: false, cols: 2,
        tabs: [tab('Intervals', I.timer), tab('Gym', I.gym, true)],
        body: [
          { t: 'Today · Deep Squat', h: '150px', w: '80%', c: '#E91E63' },
          { t: 'Deadlift', h: '110px', w: '50%', c: '#E91E63' },
          { t: '+ Add exercise or group', h: '56px', w: '0%', c: '#7C3AED' }
        ],
        note: 'B · 2 tabs, only what you train. The 📅 at the top opens the Journal (with Stats inside); ⚙ opens Settings.'
      },
      'C 4 tabs': {
        title: 'Journal', icons: [icon(I.gear)], segmented: false, cols: 4,
        tabs: [tab('Intervals', I.timer), tab('Gym', I.gym), tab('Journal', I.journal, true), tab('Stats', I.stats)],
        body: journalBody,
        note: 'C · 4 tabs: like today, only Settings leaves the bar and becomes the ⚙ at the top right.'
      }
    };
    return { o: O[v] || O['A 3 tabs'] };
  }
}
</script>
</body>
</html>
