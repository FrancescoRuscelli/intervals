<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7C3AED}a:hover{color:#6D28D9}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 4px 20px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Stats</h1>
    <div role="group" aria-label="Period" style="display: flex; padding: 3px; border-radius: 12px; background: {{t.surface}}; border: 1px solid {{t.line}}">
      <button style="height: 34px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: {{t.muted}}; font-size: 13px; font-weight: 600">Week</button>
      <button aria-pressed="true" style="height: 34px; padding: 0 12px; border: 0; border-radius: 9px; background: {{t.accent}}; color: #FFFFFF; font-size: 13px; font-weight: 600">Month</button>
      <button style="height: 34px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: {{t.muted}}; font-size: 13px; font-weight: 600">Year</button>
    </div>
  </header>
  <span style="padding: 0 20px; font-size: 12px; color: {{t.muted}}">November 2026 · example data</span>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 0">
    <div style="padding: 10px 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column"><span style="font-size: 12px; color: {{t.muted}}">Time</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600">2h 53m</span></div>
    <div style="padding: 10px 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column"><span style="font-size: 12px; color: {{t.muted}}">Sessions</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600">10</span></div>
    <div style="padding: 10px 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column"><span style="font-size: 12px; color: {{t.muted}}">Completed</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600">9/10</span></div>
  </div>

  <section style="margin: 12px 16px 0; padding: 14px 14px 10px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.line}}">
    <h2 style="margin: 0; font-size: 15px; font-weight: 600">Minutes per week</h2>
    <span style="font-size: 12px; color: {{t.muted}}">Last 8 weeks</span>
    <svg role="img" aria-label="Minutes trained per week, last 8 weeks: 40, 55, 30, 62, 48, 84, 67, and 22 so far this week" width="330" height="168" viewBox="0 0 330 168" style="display: block; margin-top: 8px">
      <sc-for list="{{grid}}" as="g" hint-placeholder-count="3">
        <line x1="26" x2="330" y1="{{g.y}}" y2="{{g.y}}" stroke="{{t.grid}}" stroke-width="1"></line>
        <text x="0" y="{{g.ty}}" font-size="10" fill="{{t.muted}}" font-family="Inter, sans-serif">{{g.label}}</text>
      </sc-for>
      <line x1="26" x2="330" y1="140" y2="140" stroke="{{t.axis}}" stroke-width="1"></line>
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
        <path d="{{b.d}}" fill="{{b.fill}}"></path>
        <text x="{{b.cx}}" y="158" text-anchor="middle" font-size="10" fill="{{t.muted}}" font-family="Inter, sans-serif">{{b.label}}</text>
      </sc-for>
      <text x="{{last.cx}}" y="{{last.ty}}" text-anchor="middle" font-size="11" font-weight="600" fill="{{t.text}}" font-family="Inter, sans-serif">22 so far</text>
    </svg>
  </section>

  <section style="margin: 12px 16px 0; padding: 14px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 15px; font-weight: 600">Most done this month</h2>
    <sc-for list="{{top}}" as="w" hint-placeholder-count="5">
      <div style="display: grid; grid-template-columns: 128px minmax(0, 1fr) 20px; align-items: center; gap: 10px; font-size: 13px">
        <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.name}}</span>
        <div style="height: 10px; border-radius: 0 4px 4px 0; background: {{t.teal}}; width: {{w.w}}"></div>
        <span style="text-align: right; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 600">{{w.n}}</span>
      </div>
    </sc-for>
  </section>

  <div style="flex: 1"></div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 18px; border-top: 1px solid {{t.line}}; background: {{t.sheet}}">
    <a href="Main.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Workouts
    </a>
    <a href="GymVisual3.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Journal
    </a>
    <a href="Stats.dc.html" aria-current="page" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.accentText}}; text-decoration: none; font-size: 12px; font-weight: 700">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: {{t.tint}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20v-8M12 20V5M19 20v-5"></path></svg>
      </span>Stats
    </a>
    <a href="Settings.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = { bg: '#000000', surface: '#1A1C21', sheet: '#16181C', line: '#23262C', text: '#F2F3F5', muted: '#9AA0AA', accent: '#7C3AED', accentText: '#C4B1FF', tint: '#2A2340', grid: '#23262C', axis: '#3A3E46', bar: '#E91E63', partial: '#7C3AED', teal: '#00BFA5' };
    const light = { bg: '#F6F5FA', surface: '#FFFFFF', sheet: '#FFFFFF', line: '#E2E0EA', text: '#17151F', muted: '#5E5A6B', accent: '#6D28D9', accentText: '#5B21B6', tint: '#EDE7FB', grid: '#ECEAF2', axis: '#C9C5D6', bar: '#D81B60', partial: '#6D28D9', teal: '#00897B' };
    const t = (this.props.mode ?? 'dark') === 'light' ? light : dark;
    const weeks = [['28 Sep', 40], ['5 Oct', 55], ['12', 30], ['19', 62], ['26', 48], ['2 Nov', 84], ['9', 67], ['16', 22]];
    const base = 140, top = 10, max = 90, x0 = 34, slot = 37, bw = 24, r = 4;
    const yOf = (v) => base - (v / max) * (base - top);
    const bars = weeks.map(([label, v], i) => {
      const x = x0 + i * slot, y = yOf(v);
      const d = 'M' + x + ' ' + base + ' V' + (y + r) + ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + ' H' + (x + bw - r) + ' Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + r) + ' V' + base + ' Z';
      return { d, label, cx: x + bw / 2, fill: i === weeks.length - 1 ? t.partial : t.bar };
    });
    const grid = [30, 60, 90].map((v) => ({ y: yOf(v), ty: yOf(v) + 3, label: v + 'm' }));
    const lastBar = bars[bars.length - 1];
    const last = { cx: lastBar.cx, ty: yOf(22) - 6 };
    const top5 = [['hangboard 70%', 3], ['hiit', 2], ['millinger abs', 2], ['max hang 20mm', 2], ['finger strenght v2', 1]];
    return { t, bars, grid, last, top: top5.map(([name, n]) => ({ name, n, w: (n / 3 * 100) + '%' })) };
  }
}
</script>
</body>
</html>
