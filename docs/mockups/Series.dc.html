<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit series</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7C3AED}a:hover{color:#6D28D9}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1420px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="background: {{color}}; color: #1A0A10; padding: 12px 8px 26px; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <span style="font-size: 15px; font-weight: 600">Series 1 of 7</span>
      <button aria-label="Delete series" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
      </button>
    </div>
    <label style="display: flex; flex-direction: column; gap: 2px; padding: 0 16px">
      <span style="font-size: 13px; font-weight: 600">Name</span>
      <input value="hang" style="border: 0; border-bottom: 2px solid rgba(26,10,16,0.45); outline: 0; background: transparent; color: inherit; font: inherit; font-size: 24px; font-weight: 600; padding: 2px 0 6px">
    </label>
    <div style="display: flex; align-items: center; justify-content: center; gap: 18px; padding-top: 8px">
      <button aria-label="5 seconds less" style="width: 52px; height: 52px; border: 2px solid rgba(26,10,16,0.5); border-radius: 26px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg>
      </button>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 76px; font-weight: 500; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums">00:05</span>
      <button aria-label="5 seconds more" style="width: 52px; height: 52px; border: 2px solid rgba(26,10,16,0.5); border-radius: 26px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <span style="text-align: center; font-size: 13px; font-weight: 500">Tap the time to type it · min : sec</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 0">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Color</h2>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{swatches}}" as="c" hint-placeholder-count="12">
          <button aria-label="Color {{c.hex}}" style="height: 44px; border-radius: 12px; border: {{c.ring}}; background: {{c.hex}}"></button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Icon</h2>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{icons}}" as="i" hint-placeholder-count="6">
          <button style="height: 64px; border-radius: 12px; border: {{i.ring}}; background: {{i.bg}}; color: {{t.text}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.path}}"></path></svg>
            <span style="font-size: 11px; color: {{t.muted}}">{{i.label}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Sides</h2>
      <div style="border-radius: 14px; background: {{t.surface}}; padding: 4px 14px 12px; display: flex; flex-direction: column">
        <label style="display: flex; align-items: center; justify-content: space-between; min-height: 50px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 15px">Do it per side</span><span style="font-size: 12px; color: {{t.muted}}">Left, then change, then right</span></span>
          <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{t.accent}}">
        </label>
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
          <span style="font-size: 15px">Time to change side</span>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 600">0:05</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; font-weight: 600">
          <span style="padding: 6px 10px; border-radius: 10px; background: {{color}}; color: #14080C">hang · left</span>
          <span style="color: {{t.muted}}">→</span>
          <span style="padding: 6px 10px; border-radius: 10px; background: #00BFA5; color: #14080C">change 0:05</span>
          <span style="color: {{t.muted}}">→</span>
          <span style="padding: 6px 10px; border-radius: 10px; background: {{color}}; color: #14080C">hang · right</span>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Log</h2>
      <div style="border-radius: 14px; background: {{t.surface}}; padding: 4px 14px 14px; display: flex; flex-direction: column">
        <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 15px">Log values for this series</span><span style="font-size: 12px; color: {{t.muted}}">Asked in the rest between rounds and at the end · starts from last time</span></span>
          <input type="checkbox" checked style="width: 22px; height: 22px; flex: none; accent-color: {{t.accent}}">
        </label>

        <div style="border-top: 1px solid {{t.line}}; padding-top: 10px; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: flex-end; gap: 10px">
            <label style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12px; color: {{t.muted}}">Field</span>
              <input value="Load" style="border: 0; border-bottom: 2px solid {{t.line}}; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 17px; font-weight: 600; padding: 4px 0 6px; min-width: 0">
            </label>
            <label style="width: 64px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12px; color: {{t.muted}}">Unit</span>
              <input value="kg" style="border: 0; border-bottom: 2px solid {{t.line}}; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 17px; font-weight: 600; padding: 4px 0 6px; min-width: 0">
            </label>
            <button aria-label="Remove field Load" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 22px; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
          <label style="display: flex; align-items: center; justify-content: space-between; min-height: 48px">
            <span style="display: flex; flex-direction: column"><span style="font-size: 15px">Left and right apart</span><span style="font-size: 12px; color: {{t.muted}}">One value per side</span></span>
            <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{t.accent}}">
          </label>
        </div>

        <div style="border-top: 1px solid {{t.line}}; padding-top: 10px; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: flex-end; gap: 10px">
            <label style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12px; color: {{t.muted}}">Field</span>
              <input value="Edge" style="border: 0; border-bottom: 2px solid {{t.line}}; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 17px; font-weight: 600; padding: 4px 0 6px; min-width: 0">
            </label>
            <label style="width: 64px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12px; color: {{t.muted}}">Unit</span>
              <input value="mm" style="border: 0; border-bottom: 2px solid {{t.line}}; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 17px; font-weight: 600; padding: 4px 0 6px; min-width: 0">
            </label>
            <button aria-label="Remove field Edge" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 22px; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
          <label style="display: flex; align-items: center; justify-content: space-between; min-height: 48px">
            <span style="display: flex; flex-direction: column"><span style="font-size: 15px">Left and right apart</span><span style="font-size: 12px; color: {{t.muted}}">Same value for both sides</span></span>
            <input type="checkbox" style="width: 22px; height: 22px; accent-color: {{t.accent}}">
          </label>
        </div>

        <button style="margin-top: 8px; height: 48px; border: 2px dashed {{t.line}}; border-radius: 12px; background: transparent; color: {{t.accentText}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add field
        </button>

        <div style="margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: {{t.tint}}; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; color: {{t.muted}}">In the journal</span>
          <span style="font-size: 14px; font-weight: 600">hang · Load L +10 kg · R +8 kg · Edge 20 mm</span>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 2px">
      <h2 style="margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Sound</h2>
      <label style="display: flex; align-items: center; justify-content: space-between; height: 48px">
        <span style="font-size: 15px">Say the name when it starts</span>
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{t.accent}}">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; height: 48px">
        <span style="font-size: 15px">Beep the last 3 seconds</span>
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{t.accent}}">
      </label>
    </section>
  </div>

  <div style="padding: 12px 16px 22px">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 16px; font-weight: 600">Done</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"color":{"editor":"color","default":"#E91E63","options":["#E91E63","#FFC107","#00BFA5","#7C3AED"]},"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = { bg: '#000000', surface: '#1A1C21', line: '#2A2D34', text: '#F2F3F5', muted: '#9AA0AA', accent: '#7C3AED', accentText: '#C4B1FF', onAccent: '#FFFFFF', tint: '#2A2340', sel: '#F2F3F5' };
    const light = { bg: '#F6F5FA', surface: '#FFFFFF', line: '#E2E0EA', text: '#17151F', muted: '#5E5A6B', accent: '#6D28D9', accentText: '#5B21B6', onAccent: '#FFFFFF', tint: '#EDE7FB', sel: '#17151F' };
    const t = (this.props.mode ?? 'dark') === 'light' ? light : dark;
    const color = this.props.color ?? '#E91E63';
    const hexes = ['#E91E63', '#FFC107', '#00BFA5', '#7C3AED', '#F44336', '#FF5722', '#FF9800', '#CDDC39', '#8BC34A', '#4CAF50', '#03A9F4', '#3F51B5'];
    const icons = [
      { label: 'Jump', path: 'M12 18V5M6.5 10.5L12 5l5.5 5.5M5 21h14' },
      { label: 'Run', path: 'M14 4.5a1.5 1.5 0 1 0 0 .01M6 12l3-3h5l2 4h3M10 9l-2 5 4 2v5M8 14l-3 5' },
      { label: 'Stand', path: 'M12 3.5a1.5 1.5 0 1 0 0 .01M12 7v7M8 10h8M12 14l-3 7M12 14l3 7' },
      { label: 'Weight', path: 'M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12' },
      { label: 'Warm-up', path: 'M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2-6 1.5 1.5 3 2.5 3 5' },
      { label: 'Cool', path: 'M12 2v20M3.5 7l17 10M20.5 7l-17 10' }
    ];
    return {
      t,
      color,
      swatches: hexes.map((hex) => ({ hex, ring: hex.toLowerCase() === color.toLowerCase() ? '3px solid ' + t.sel : '3px solid transparent' })),
      icons: icons.map((i, n) => ({ ...i, ring: n === 0 ? '2px solid ' + t.accent : '2px solid transparent', bg: n === 0 ? t.tint : t.surface }))
    };
  }
}
</script>
</body>
</html>
