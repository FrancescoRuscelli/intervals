<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7C3AED}a:hover{color:#6D28D9}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{page.bg}}; color: {{page.text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 0">
    <button aria-label="Stop workout" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <span style="font-size: 16px; font-weight: 600">hangboard 70%</span>
    <button aria-label="Sound on" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
    </button>
  </header>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 20px 0; text-align: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 500; color: {{page.muted}}">Round</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600">2<span style="color: {{page.muted}}">/4</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 500; color: {{page.muted}}">Remaining</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600">3:33</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 500; color: {{page.muted}}">Series</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600">3<span style="color: {{page.muted}}">/7</span></span>
    </div>
  </div>

  <sc-if value="{{isDisc}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative">
      <svg role="img" aria-label="Round 2: series 3 of 7, hang, 3 seconds left" width="374" height="374" viewBox="0 0 374 374">
        <sc-for list="{{arcs}}" as="a" hint-placeholder-count="9">
          <path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="butt"></path>
        </sc-for>
        <circle cx="187" cy="187" r="156" fill="{{color}}"></circle>
        <circle cx="{{dot.x}}" cy="{{dot.y}}" r="11" fill="{{page.text}}" stroke="{{page.bg}}" stroke-width="4"></circle>
      </svg>
      <div style="position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #14080C">
        <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5M6.5 10.5L12 5l5.5 5.5M5 21h14"></path></svg>
        <span style="font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px">hang</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 112px; font-weight: 600; line-height: 1; letter-spacing: -4px; font-variant-numeric: tabular-nums">0:03</span>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isFull}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 20px">
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5M6.5 10.5L12 5l5.5 5.5M5 21h14"></path></svg>
      <span style="font-size: 40px; font-weight: 700; text-transform: uppercase; letter-spacing: 4px">hang</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 168px; font-weight: 600; line-height: 1; letter-spacing: -6px; font-variant-numeric: tabular-nums">0:03</span>
      <div style="align-self: stretch; height: 12px; margin-top: 14px; border-radius: 6px; background: rgba(20,8,12,0.18); overflow: hidden; display: flex; justify-content: flex-end">
        <div style="width: 60%; background: #14080C; border-radius: 6px"></div>
      </div>
    </div>
  </sc-if>

  <div style="margin: 0 16px; padding: 12px 16px; border-radius: 14px; background: {{page.card}}; display: flex; align-items: center; gap: 12px">
    <span style="font-size: 13px; font-weight: 500; color: {{page.muted}}">Next</span>
    <span style="width: 14px; height: 14px; border-radius: 7px; background: #FFC107; border: 2px solid {{page.card}}"></span>
    <span style="flex: 1; font-size: 17px; font-weight: 600">rest</span>
    <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 600">0:05</span>
  </div>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 3px; height: 6px">
      <div style="flex: 5 1 0; border-radius: 3px; background: {{page.barOn}}"></div>
      <div style="flex: 35 1 0; border-radius: 3px; background: {{page.barOn}}"></div>
      <div style="flex: 60 1 0; height: 3px; align-self: center; border-radius: 2px; background: {{page.barOn}}"></div>
      <div style="flex: 35 1 0; border-radius: 3px; background: {{page.barOff}}; overflow: hidden; display: flex"><div style="width: 34%; background: {{page.barOn}}"></div></div>
      <div style="flex: 60 1 0; height: 3px; align-self: center; border-radius: 2px; background: {{page.barOff}}"></div>
      <div style="flex: 35 1 0; border-radius: 3px; background: {{page.barOff}}"></div>
      <div style="flex: 60 1 0; height: 3px; align-self: center; border-radius: 2px; background: {{page.barOff}}"></div>
      <div style="flex: 35 1 0; border-radius: 3px; background: {{page.barOff}}"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: {{page.muted}}"><span>1:52 done · thin lines = rest between rounds</span><span>5:25 total</span></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 36px; padding: 18px 0 30px">
    <button aria-label="Previous series" style="width: 58px; height: 58px; border: 0; border-radius: 29px; background: {{page.ctl}}; color: {{page.ctlText}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13a.8.8 0 0 1-1.2.7L9.5 12.7a.8.8 0 0 1 0-1.4l9.3-6.5a.8.8 0 0 1 1.2.7z"></path></svg>
    </button>
    <button aria-label="Pause" style="width: 88px; height: 88px; border: 0; border-radius: 44px; background: {{page.main}}; color: {{page.mainText}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"></rect><rect x="14" y="4.5" width="4" height="15" rx="1"></rect></svg>
    </button>
    <button aria-label="Next series" style="width: 58px; height: 58px; border: 0; border-radius: 29px; background: {{page.ctl}}; color: {{page.ctlText}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13a.8.8 0 0 0 1.2.7l9.3-6.5a.8.8 0 0 0 0-1.4L5.2 4.8A.8.8 0 0 0 4 5.5z"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"look":{"editor":"enum","options":["disc","full"],"default":"disc"},"color":{"editor":"color","default":"#E91E63","options":["#E91E63","#FFC107","#03A9F4","#8BC34A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const color = this.props.color ?? '#E91E63';
    const look = this.props.look ?? 'disc';
    const dark = { bg: '#000000', text: '#F2F3F5', muted: '#9AA0AA', card: '#1A1C21', barOn: '#F2F3F5', barOff: '#2A2D34', ctl: '#1F2127', ctlText: '#F2F3F5', main: '#7C3AED', mainText: '#FFFFFF', done: '#2A2D34' };
    const light = { bg: '#F6F5FA', text: '#17151F', muted: '#5E5A6B', card: '#FFFFFF', barOn: '#17151F', barOff: '#DEDBE7', ctl: '#EDE7FB', ctlText: '#5B21B6', main: '#6D28D9', mainText: '#FFFFFF', done: '#DEDBE7' };
    const full = { bg: color, text: '#14080C', muted: '#3B1A24', card: 'rgba(20,8,12,0.14)', barOn: '#14080C', barOff: 'rgba(20,8,12,0.2)', ctl: 'rgba(20,8,12,0.16)', ctlText: '#14080C', main: '#14080C', mainText: '#FFFFFF', done: '' };
    const page = look === 'full' ? full : ((this.props.mode ?? 'dark') === 'light' ? light : dark);

    // outer ring: the series of one round, proportional to their length
    const series = [[5, '#E91E63'], [5, '#FFC107'], [5, '#E91E63'], [5, '#FFC107'], [5, '#E91E63'], [5, '#FFC107'], [5, '#E91E63'], [60, '', true]];
    const current = 2, doneFrac = 0.4;
    const cx = 187, cy = 187, r = 174, gap = 3;
    const total = series.reduce((s, x) => s + x[0], 0);
    const span = 360 - gap * series.length;
    const pt = (deg) => { const a = deg * Math.PI / 180; return { x: +(cx + r * Math.sin(a)).toFixed(2), y: +(cy - r * Math.cos(a)).toFixed(2) }; };
    const arc = (a0, a1) => { const p = pt(a0), q = pt(a1); return 'M' + p.x + ' ' + p.y + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + q.x + ' ' + q.y; };
    const arcs = [];
    let a = gap / 2, dot = pt(0);
    series.forEach(([d, c, brk], i) => {
      const len = span * d / total, end = a + len;
      if (i < current) arcs.push({ d: arc(a, end), c: page.done, w: 16 });
      else if (i === current) {
        const mid = a + len * doneFrac;
        arcs.push({ d: arc(a, mid), c: page.done, w: 16 });
        arcs.push({ d: arc(mid, end), c, w: 24 });
        dot = pt(mid);
      } else arcs.push({ d: arc(a, end), c: brk ? page.muted : c, w: brk ? 5 : 16 });
      a = end + gap;
    });
    return { page, color, arcs, dot, isDisc: look !== 'full', isFull: look === 'full' };
  }
}
</script>
</body>
</html>
