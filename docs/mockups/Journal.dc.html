<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7C3AED}a:hover{color:#6D28D9}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 12px 4px 20px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Journal</h1>
    <div style="display: flex; align-items: center">
      <button aria-label="Previous month" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <span style="font-size: 15px; font-weight: 600; min-width: 112px; text-align: center">November 2026</span>
      <button aria-label="Next month" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
  </header>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px 16px 0">
    <div style="padding: 10px 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column"><span style="font-size: 12px; color: {{t.muted}}">Sessions</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600">10</span></div>
    <div style="padding: 10px 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column"><span style="font-size: 12px; color: {{t.muted}}">Days trained</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600">8</span></div>
    <div style="padding: 10px 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column"><span style="font-size: 12px; color: {{t.muted}}">Time</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600">2h 53m</span></div>
  </div>

  <div style="margin: 12px 16px 0; padding: 10px 8px 12px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.line}}">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 600; color: {{t.muted}}; padding-bottom: 6px">
      <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
        <div style="height: 42px; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{c.real}}" hint-placeholder-val="{{ true }}">
            <button aria-label="{{c.label}}" style="width: 40px; height: 40px; padding: 0; border-radius: 20px; border: {{c.ring}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 14px; font-weight: {{c.fw}}">
              <span style="line-height: 1">{{c.n}}</span>
              <span style="display: flex; gap: 2px; height: 5px">
                <sc-for list="{{c.dots}}" as="d" hint-placeholder-count="1">
                  <span style="width: 5px; height: 5px; border-radius: 3px; background: {{c.dot}}"></span>
                </sc-for>
              </span>
            </button>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 0">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Today · Monday 16</span>

    <div style="padding: 12px 14px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <span style="font-size: 16px; font-weight: 600">hangboard 70%</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 16px; font-weight: 600">6:25</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{t.muted}}">
        <span>18:05</span><span>·</span>
        <span style="display: flex; align-items: center; gap: 4px; color: {{t.ok}}; font-weight: 600"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Completed 4/4 rounds</span>
      </div>
      <span style="font-size: 14px; color: {{t.soft}}; font-style: italic">“[your note, e.g. how it felt]”</span>
    </div>

    <div style="padding: 12px 14px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <span style="font-size: 16px; font-weight: 600">max hang 20mm</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 16px; font-weight: 600">15:40</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{t.muted}}">
        <span>19:10</span><span>·</span>
        <span style="display: flex; align-items: center; gap: 4px; color: {{t.warn}}; font-weight: 600"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>Stopped in round 1 of 2</span>
      </div>
      <button style="align-self: flex-start; height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: {{t.tint}}; color: {{t.accentText}}; font-size: 13px; font-weight: 600">+ Add a note</button>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 18px; border-top: 1px solid {{t.line}}; background: {{t.sheet}}">
    <a href="Main.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Workouts
    </a>
    <a href="Journal.dc.html" aria-current="page" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.accentText}}; text-decoration: none; font-size: 12px; font-weight: 700">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: {{t.tint}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
      </span>Journal
    </a>
    <a href="Stats.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20v-8M12 20V5M19 20v-5"></path></svg>Stats
    </a>
    <a href="Settings.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = { bg: '#000000', surface: '#1A1C21', sheet: '#16181C', line: '#23262C', text: '#F2F3F5', muted: '#9AA0AA', soft: '#C9CDD3', accent: '#7C3AED', accentText: '#C4B1FF', tint: '#2A2340', ok: '#7FD99A', warn: '#FFB86B' };
    const light = { bg: '#F6F5FA', surface: '#FFFFFF', sheet: '#FFFFFF', line: '#E2E0EA', text: '#17151F', muted: '#5E5A6B', soft: '#3A3646', accent: '#6D28D9', accentText: '#5B21B6', tint: '#EDE7FB', ok: '#1D7A3A', warn: '#B45309' };
    const t = (this.props.mode ?? 'dark') === 'light' ? light : dark;
    // example sessions per day (count) for November 2026; Nov 1 is a Sunday
    const sessions = { 2: 1, 4: 2, 6: 1, 9: 1, 11: 1, 13: 1, 14: 1, 16: 2 };
    const today = 16, selected = 16;
    const cells = [];
    for (let i = 0; i < 6; i++) cells.push({ real: false });
    for (let d = 1; d <= 30; d++) {
      const n = sessions[d] || 0, sel = d === selected, future = d > today;
      cells.push({
        real: true, n: d,
        label: d + ' November' + (n ? ', ' + n + (n > 1 ? ' sessions' : ' session') : ''),
        dots: Array.from({ length: n }).map(() => ({})),
        bg: sel ? t.accent : 'transparent',
        fg: sel ? '#FFFFFF' : (future ? t.muted : t.text),
        dot: sel ? '#FFFFFF' : t.accentText,
        ring: d === today && !sel ? '2px solid ' + t.accent : '2px solid transparent',
        fw: n || sel ? 700 : 500
      });
    }
    while (cells.length < 42) cells.push({ real: false });
    return { t, cells };
  }
}
</script>
</body>
</html>
