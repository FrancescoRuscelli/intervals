<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym sets, option F</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<dc-import name="GymSetsGrouping" layout="F two columns, your side highlighted" side="{{side}}" hint-size="390px,844px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"side":{"editor":"enum","options":["Left","Right","Both"],"default":"Left"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { side: this.props.side ?? 'Left' }; }
}
</script>
</body>
</html>
