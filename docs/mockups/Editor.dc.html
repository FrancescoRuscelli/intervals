<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7C3AED}a:hover{color:#6D28D9}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px">
    <button aria-label="Close without saving" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <span style="font-size: 16px; font-weight: 600">Edit workout</span>
    <button style="height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 15px; font-weight: 600">Save</button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 12px">
    <label style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: {{t.muted}}">Workout name</span>
      <input value="hangboard 70%" style="border: 0; border-bottom: 2px solid {{t.accent}}; outline: 0; background: transparent; color: {{t.text}}; font: inherit; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 26px; font-weight: 600; padding: 4px 0 6px">
    </label>

    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="height: 30px; padding: 0 6px 0 12px; border-radius: 15px; background: {{t.tint}}; color: {{t.accentText}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 2px">Hangboard
        <button aria-label="Remove tag Hangboard" style="width: 24px; height: 24px; border: 0; border-radius: 12px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
      </span>
      <button style="height: 30px; padding: 0 12px; border-radius: 15px; border: 1px dashed {{t.faint}}; background: transparent; color: {{t.muted}}; font-size: 13px; font-weight: 600">+ Tag</button>
    </div>

    <button style="height: 52px; border: 1px solid {{t.line}}; border-radius: 14px; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.warm}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2-6 1.5 1.5 3 2.5 3 5"></path></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 500">Warm-up</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 600">0:05</span>
    </button>

    <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 6px 0 16px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}">
      <span style="font-size: 15px; font-weight: 500">Rounds</span>
      <div style="display: flex; align-items: center; gap: 4px">
        <button aria-label="Fewer rounds" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: {{t.tint}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"></path></svg>
        </button>
        <span style="width: 44px; text-align: center; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">4</span>
        <button aria-label="More rounds" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: {{t.tint}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </div>

    <button style="height: 52px; border: 1px solid {{t.line}}; border-radius: 14px; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.accentText}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10M7 20h10M8 4c0 5 8 5 8 8s-8 3-8 8M16 4c0 5-8 5-8 8"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Rest between rounds</span><span style="font-size: 12px; color: {{t.muted}}">Never after the last round</span></span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 600">1:00</span>
    </button>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: {{t.muted}}">
        <span>One round · 0:35</span>
        <span>Total <strong style="color: {{t.text}}; font-weight: 600">5:25</strong></span>
      </div>
      <div style="display: flex; gap: 2px; height: 8px">
        <sc-for list="{{flat}}" as="s" hint-placeholder-count="7">
          <div style="flex: {{s.d}} 1 0; min-width: 3px; border-radius: 3px; background: {{s.c}}"></div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; background: {{t.sheet}}; border-top: 1px solid {{t.line}}; border-radius: 22px 22px 0 0; padding: 12px 0 0; display: flex; flex-direction: column">
    <sc-if value="{{normal}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px 8px">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.6px; color: {{t.muted}}; text-transform: uppercase">Series in each round</span>
        <span style="font-size: 12px; color: {{t.muted}}">Long-press to select</span>
      </div>

      <div style="margin: 0 12px; border-radius: 16px; border: 2px solid {{t.groupLine}}; background: {{t.group}}; padding: 2px 0 4px">
        <div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 4px 0 12px">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.accentText}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"></path></svg>
          <span style="flex: 1; font-size: 15px; font-weight: 600; color: {{t.accentText}}">Repeat</span>
          <button aria-label="Fewer repeats" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 20px; font-weight: 700; color: {{t.accentText}}">×3</span>
          <button aria-label="More repeats" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>
        <sc-for list="{{grouped}}" as="s" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 4px 0 14px">
            <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: {{s.c}}; color: #111; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0; font-size: 16px">{{s.name}}</span>
            <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 16px; font-weight: 500; color: {{t.soft}}">{{s.t}}</span>
            <span aria-hidden="true" style="width: 40px; display: flex; justify-content: center; color: {{t.faint}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></span>
          </div>
        </sc-for>
      </div>

      <div style="position: relative; height: 52px; margin-top: 6px; overflow: hidden">
        <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 120px; background: {{t.danger}}; color: #FFFFFF; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding-right: 20px; font-size: 14px; font-weight: 700">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>Delete
        </div>
        <div style="position: absolute; left: -96px; right: 96px; top: 0; bottom: 0; background: {{t.sheet}}; display: flex; align-items: center; gap: 14px; padding: 0 8px 0 26px">
          <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #E91E63; color: #111; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5M6.5 10.5L12 5l5.5 5.5M5 21h14"></path></svg>
          </span>
          <span style="flex: 1; font-size: 16px">hang</span>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 16px; font-weight: 500; color: {{t.soft}}">0:05</span>
        </div>
      </div>
      <span style="padding: 2px 20px 0; font-size: 12px; color: {{t.muted}}">← swipe a series to delete it</span>
    </sc-if>

    <sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px 6px">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.6px; color: {{t.accentText}}; text-transform: uppercase">2 selected</span>
        <button style="height: 32px; border: 0; background: transparent; color: {{t.accentText}}; font-size: 14px; font-weight: 600; padding: 0">Cancel</button>
      </div>
      <sc-for list="{{flatRows}}" as="s" hint-placeholder-count="7">
        <label style="display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 20px; background: {{s.bg}}">
          <input type="checkbox" checked="{{s.on}}" style="flex: none; width: 22px; height: 22px; accent-color: {{t.accent}}">
          <span style="flex: none; width: 30px; height: 30px; border-radius: 15px; background: {{s.c}}"></span>
          <span style="flex: 1; font-size: 16px">{{s.name}}</span>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 16px; font-weight: 500; color: {{t.soft}}">{{s.t}}</span>
        </label>
      </sc-for>
    </sc-if>
  </div>

  <sc-if value="{{normal}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: {{t.sheet}}; border-top: 1px solid {{t.line}}; display: flex; gap: 10px">
      <button style="flex: 1; height: 50px; border: 0; border-radius: 14px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Work
      </button>
      <button style="flex: 1; height: 50px; border: 0; border-radius: 14px; background: {{t.tint}}; color: {{t.accentText}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Rest
      </button>
      <button aria-label="Add a custom series" style="width: 50px; height: 50px; border: 0; border-radius: 14px; background: {{t.tint}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"></path></svg>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 22px; background: {{t.sheet}}; border-top: 1px solid {{t.line}}; display: flex; gap: 8px">
      <button style="flex: 1.5; height: 52px; border: 0; border-radius: 14px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"></path></svg>Repeat ×…
      </button>
      <button style="flex: 1; height: 52px; border: 0; border-radius: 14px; background: {{t.tint}}; color: {{t.accentText}}; font-size: 14px; font-weight: 600">Duplicate</button>
      <button aria-label="Delete selected" style="width: 52px; height: 52px; border: 0; border-radius: 14px; background: {{t.tint}}; color: {{t.dangerText}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
      </button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["normal","select"],"default":"normal"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = { bg: '#000000', surface: '#1A1C21', sheet: '#16181C', line: '#23262C', text: '#F2F3F5', muted: '#9AA0AA', soft: '#C9CDD3', faint: '#6E747E', accent: '#7C3AED', onAccent: '#FFFFFF', accentText: '#C4B1FF', tint: '#2A2340', warm: '#FF8A3D', group: '#1C1828', groupLine: '#3B2F63', danger: '#C62828', dangerText: '#FF8A80', selBg: '#221C35' };
    const light = { bg: '#F6F5FA', surface: '#FFFFFF', sheet: '#FFFFFF', line: '#E2E0EA', text: '#17151F', muted: '#5E5A6B', soft: '#3A3646', faint: '#8C889A', accent: '#6D28D9', onAccent: '#FFFFFF', accentText: '#5B21B6', tint: '#EDE7FB', warm: '#C2410C', group: '#F7F3FF', groupLine: '#D9CCF7', danger: '#C62828', dangerText: '#B71C1C', selBg: '#F1EAFE' };
    const t = (this.props.mode ?? 'dark') === 'light' ? light : dark;
    const selecting = (this.props.state ?? 'normal') === 'select';
    const JUMP = 'M12 18V5M6.5 10.5L12 5l5.5 5.5M5 21h14';
    const STAND = 'M12 3.5a1.5 1.5 0 1 0 0 .01M12 7v7M8 10h8M12 14l-3 7M12 14l3 7';
    const hang = { name: 'hang', t: '0:05', d: 5, c: '#E91E63', icon: JUMP };
    const rest = { name: 'rest', t: '0:05', d: 5, c: '#FFC107', icon: STAND };
    const flat = [hang, rest, hang, rest, hang, rest, hang];
    return {
      t, normal: !selecting, selecting,
      flat,
      grouped: [hang, rest],
      flatRows: flat.map((s, i) => ({ ...s, on: i < 2, bg: i < 2 ? t.selBg : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
