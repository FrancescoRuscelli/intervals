<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym, log a set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 8px 0">
    <a href="GymToday.dc.html" aria-label="Back to today" style="width: 44px; height: 44px; flex: none; border-radius: 22px; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 17px; font-weight: 700">{{ex.name}}</span>
      <span style="font-size: 12px; color: #9AA0AA">Last · {{ex.last}}</span>
    </span>
    <a href="GymEditExercise.dc.html" aria-label="Edit exercise" style="width: 44px; height: 44px; flex: none; border-radius: 22px; color: #9AA0AA; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"></path></svg>
    </a>
  </header>

  <nav role="tablist" style="display: flex; justify-content: center; gap: 22px; padding: 10px 16px 0; border-bottom: 1px solid #1A1C21">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" role="tab" aria-selected="{{t.on}}" style="padding: 6px 2px 10px; border-bottom: 2px solid {{t.line}}; color: {{t.fg}}; font-size: 14px; font-weight: 600; text-decoration: none">{{t.label}}</a>
    </sc-for>
  </nav>

  <sc-if value="{{ex.perSide}}" hint-placeholder-val="{{ false }}">
    <div role="group" aria-label="Side" style="display: flex; align-self: center; margin-top: 14px; padding: 3px; border-radius: 12px; background: #1A1C21">
      <sc-for list="{{sides}}" as="sd" hint-placeholder-count="3">
        <button aria-pressed="{{sd.on}}" style="width: 74px; height: 34px; border: 0; border-radius: 9px; background: {{sd.bg}}; color: {{sd.fg}}; font-size: 14px; font-weight: 700">{{sd.label}}</button>
      </sc-for>
    </div>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px 16px 0">
    <sc-for list="{{ex.tiles}}" as="f" hint-placeholder-count="2">
      <div style="grid-column: {{f.span}}; padding: 12px 10px 10px; border-radius: 20px; background: #1A1C21; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <span style="font-size: 12px; color: #9AA0AA; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">{{f.label}}</span>
        <sc-if value="{{f.isBands}}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; gap: 8px; padding: 6px 0 4px">
            <sc-for list="{{f.bands}}" as="b" hint-placeholder-count="5">
              <span style="width: 40px; height: 40px; border-radius: 20px; background: {{b.c}}; box-shadow: inset 0 0 0 1px {{b.edge}}; opacity: {{b.op}}; display: flex; align-items: center; justify-content: center; color: {{b.fg}}; font-size: 13px; font-weight: 800">{{b.label}}</span>
            </sc-for>
          </span>
        </sc-if>
        <sc-if value="{{f.isStep}}" hint-placeholder-val="{{ true }}">
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">{{f.value}}<span style="font-size: 16px; color: #9AA0AA; margin-left: 4px">{{f.unit}}</span></span>
          <span style="display: flex; gap: 8px; width: 100%">
            <button aria-label="{{f.label}} minus {{f.step}}" style="flex: 1; height: 46px; border: 0; border-radius: 14px; background: #3A1428; color: #FF8AB3; font-size: 24px; font-weight: 700">−</button>
            <button aria-label="{{f.label}} plus {{f.step}}" style="flex: 1; height: 46px; border: 0; border-radius: 14px; background: #3A1428; color: #FF8AB3; font-size: 24px; font-weight: 700">+</button>
          </span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px; padding: 12px 16px 0">
    <button style="flex: 1; height: 60px; border: 0; border-radius: 20px; background: #7C3AED; color: #FFFFFF; font-size: 18px; font-weight: 700">{{logLabel}}</button>
    <a href="GymSetNote.dc.html" aria-label="Add a note to the next set" style="width: 60px; height: 60px; border-radius: 20px; background: #1A1C21; color: #9AA0AA; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4 4v-4H5.5A1.5 1.5 0 0 1 4 14.5z"></path></svg>
    </a>
  </div>

  <div role="timer" aria-label="Resting 1 minute 12 seconds, buzz at {{ex.rest}}" style="align-self: center; margin-top: 12px; height: 32px; padding: 0 14px; border-radius: 16px; background: #0E3B35; color: #5EEAD4; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5l3 2M12 3.5a9 9 0 1 0 0 18a9 9 0 0 0 0-18"></path></svg>
    <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 15px; font-variant-numeric: tabular-nums">1:12</span>
    <span style="color: #8FD9CC">resting · buzz at {{ex.rest}}</span>
  </div>

  <section aria-label="Today's sets" style="flex: 1; overflow: hidden; margin-top: 14px; padding: 0 16px; display: flex; flex-direction: column">
    <sc-for list="{{ex.today}}" as="s" hint-placeholder-count="3">
      <a href="GymSetNote.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 6px; border-bottom: 1px solid #16181C; color: inherit; text-decoration: none">
        <span style="width: 26px; height: 26px; flex: none; border-radius: 13px; background: #3A1428; color: #FF8AB3; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.n}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 600; color: {{s.fg}}">{{s.text}}</span>
          <sc-if value="{{s.note}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #9AA0AA">{{s.note}}</span></sc-if>
        </span>
        <sc-if value="{{s.pr}}" hint-placeholder-val="{{ false }}"><span style="height: 20px; padding: 0 7px; border-radius: 10px; background: #FFC107; color: #1A1200; font-size: 11px; font-weight: 800; display: flex; align-items: center">PR</span></sc-if>
        <span style="font-size: 12px; color: #6E747E; font-variant-numeric: tabular-nums">{{s.rest}}</span>
      </a>
    </sc-for>
    <span style="padding: 10px 6px 0; font-size: 12px; color: #4A4F58">tap a set to edit or add a note</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"exercise":{"editor":"enum","options":["deadlift","block pulls","pistol squat"],"default":"deadlift"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = { g: ['#43A047', '#43A047'], p: ['#8E44D8', '#8E44D8'], k: ['#16181C', '#5A5F68'], r: ['#E53935', '#E53935'], y: ['#FFC107', '#FFC107'] };
    const bands = (s) => 'gpkry'.split('').map((ch) => {
      const n = s.split('').filter((x) => x === ch).length;
      return { c: B[ch][0], edge: B[ch][1], op: n ? 1 : 0.25, label: n > 1 ? '×' + n : '', fg: ch === 'y' ? '#1A1200' : '#FFFFFF' };
    });
    const step = (label, value, unit, stepTxt) => ({ label, value, unit, step: stepTxt, isStep: true, isBands: false, span: 'auto' });
    const set = (n, text, o = {}) => ({ n, text, rest: o.rest || '', note: o.note || '', pr: !!o.pr, fg: '#FFD1E1' });
    const all = {
      'deadlift': {
        name: 'Deadlift', perSide: false, rest: '3:00', last: 'Wed · 110 × 5, 5',
        tiles: [step('Weight', '110', 'kg', '2.5 kg'), step('Reps', '5', '', '1')],
        today: [set(1, '70 kg × 5'), set(2, '90 kg × 5', { rest: '2:10' }), set(3, '110 kg × 5', { rest: '3:20' })]
      },
      'block pulls': {
        name: 'Block Pulls', perSide: true, rest: '2:00', last: 'Tue · R 50 × 5 · L 45 × 5',
        tiles: [step('Weight', '50', 'kg', '1 kg'), step('Reps', '5', '', '1')],
        today: [set('R', '50 kg × 5'), set('L', '45 kg × 5', { rest: '0:45' }), set('R', '50 kg × 5', { rest: '2:20', note: 'senza mignolo' })]
      },
      'pistol squat': {
        name: 'Pistol Squat', perSide: true, rest: '3:00', last: 'Wed · 🟢🟣🟣🔴 × 5',
        tiles: [{ label: 'Bands', isStep: false, isBands: true, span: '1 / -1', bands: bands('gppr') }, step('Reps', '5', '', '1')],
        today: [set('L', '🟢🟣🟣🔴 × 5'), set('R', '🟢🟣🟣🔴 × 5', { rest: '1:05' }), set('L', '🟢🟣🔴 × 6', { rest: '3:10', pr: true })]
      }
    };
    const ex = all[this.props.exercise ?? 'deadlift'] || all['deadlift'];
    if (ex.tiles.length === 2 && ex.tiles[0].isBands) ex.tiles[1].span = '1 / -1';
    const tabs = [['Log', 'GymExercise.dc.html', true], ['History', 'GymExHistory.dc.html'], ['Graph', 'GymHistory.dc.html'], ['Records', 'GymRecords.dc.html']]
      .map(([label, href, on]) => ({ label, href, on: on ? 'true' : 'false', fg: on ? '#F2F3F5' : '#6E747E', line: on ? '#7C3AED' : 'transparent' }));
    const sides = ['Left', 'Right', 'Both'].map((label, i) => ({ label, on: i === 1 ? 'true' : 'false', bg: i === 1 ? '#F2F3F5' : 'transparent', fg: i === 1 ? '#000000' : '#9AA0AA' }));
    const logLabel = ex.perSide ? 'Log right' : 'Log set ' + (ex.today.length + 1);
    return { ex, tabs, sides, logLabel };
  }
}
</script>
</body>
</html>
