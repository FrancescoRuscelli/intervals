<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym, add exercise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 8px 8px">
    <a href="GymToday.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 22px; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <label style="flex: 1; height: 48px; border-radius: 24px; background: #1A1C21; display: flex; align-items: center; gap: 10px; padding: 0 16px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0AA" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <input aria-label="Search your exercises" value="{{query}}" placeholder="Search your exercises" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #F2F3F5; font: inherit; font-size: 16px">
    </label>
  </header>

  <sc-if value="{{searching}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 4px 16px 0">
      <sc-for list="{{found}}" as="e" hint-placeholder-count="2">
        <a href="GymExercise.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-radius: 16px; background: #1A1C21; color: inherit; text-decoration: none">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{e.name}}</span><span style="font-size: 12px; color: #9AA0AA">{{e.last}}</span></span>
          <span style="font-size: 12px; color: #9AA0AA">{{e.fields}}</span>
        </a>
      </sc-for>
      <a href="GymNewExercise.dc.html" style="height: 56px; border-radius: 16px; border: 2px dashed #3A2F5C; color: #C4B1FF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New exercise "{{query}}"
      </a>
    </div>
  </sc-if>

  <sc-if value="{{browsing}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0 16px">
      <h2 style="margin: 8px 4px 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #9AA0AA">Recent</h2>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{recent}}" as="e" hint-placeholder-count="6">
          <a href="GymExercise.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 6px 0 14px; border-radius: 16px; background: #1A1C21; color: inherit; text-decoration: none">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{e.name}}</span><span style="font-size: 12px; color: #9AA0AA">{{e.last}}</span></span>
            <sc-if value="{{e.side}}" hint-placeholder-val="{{ false }}"><span style="height: 22px; padding: 0 7px; border-radius: 11px; background: #0E3B35; color: #5EEAD4; font-size: 11px; font-weight: 700; display: flex; align-items: center">L · R</span></sc-if>
            <span style="width: 40px; height: 40px; border-radius: 12px; background: #2A2340; color: #C4B1FF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
          </a>
        </sc-for>
      </div>
      <h2 style="margin: 16px 4px 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #9AA0AA">All, A–Z · 62</h2>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{az}}" as="e" hint-placeholder-count="4">
          <a href="GymExercise.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 14px; border-bottom: 1px solid #1A1C21; color: inherit; text-decoration: none; font-size: 15px">{{e}}</a>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"typing":{"editor":"enum","options":["nothing yet","&quot;pull&quot;","&quot;hip thrust&quot;"],"default":"nothing yet"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const typing = this.props.typing ?? 'nothing yet';
    const query = typing === 'nothing yet' ? '' : typing.replace(/"/g, '');
    const db = {
      pull: [
        { name: 'Pull Up', last: 'Sun 15 · +30 kg × 5, 5, 4', fields: 'weight · reps' },
        { name: 'Block Pulls', last: 'Tue 3 · R 50 × 5 · L 45 × 5', fields: 'per side' },
        { name: 'Deloaded One Arm Pull-Up', last: 'Fri 2 Jan · R −20 × 3', fields: 'assist · per side' },
        { name: 'Pull Up (Second Half)', last: '18 Sep · +25 kg × 5', fields: 'weight · reps' }
      ],
      'hip thrust': []
    };
    return {
      query, searching: !!query, browsing: !query,
      found: db[query] || [],
      recent: [
        { name: 'Barbell Deep Squat', last: 'Wed 11 · 80 kg × 5 × 4', side: false },
        { name: 'Deadlift', last: 'Wed 11 · 110 kg × 5, 5, 3', side: false },
        { name: 'Bulgarian Bar Squat', last: 'Wed 11 · 70 kg × 5', side: true },
        { name: 'Pull Up', last: 'Sun 15 · +30 kg × 5, 5, 4', side: false },
        { name: 'Overhead Press', last: 'Fri 13 · 40 kg × 5', side: false },
        { name: 'Box Pike Push Up', last: 'Fri 13 · 6, 6, 5', side: false }
      ],
      az: ['Bar Dips', 'Barbell Curl', 'Barbell Deep Squat', 'Block Claw Pull']
    };
  }
}
</script>
</body>
</html>
