<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Train tab, Intervals and Gym</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; padding: 16px 10px 4px 20px">
    <span style="flex: 1; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700">Train</span>
    <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a3 3 0 1 0 0 6a3 3 0 0 0 0-6M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg></span>
  </header>
  <div style="display: flex; margin: 8px 16px 0; padding: 4px; border-radius: 14px; background: #1A1C21">
    <sc-for list="{{seg}}" as="g" hint-placeholder-count="2">
      <span style="flex: 1; height: 40px; border-radius: 10px; background: {{g.bg}}; color: {{g.fg}}; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{g.t}}</span>
    </sc-for>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="padding: 12px 14px; border-radius: 16px; background: #1A1C21; display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; justify-content: space-between"><span style="font-size: 16px; font-weight: 600">{{r.name}}</span><span style="font-size: 15px; font-weight: 600; color: #C9CDD3">{{r.right}}</span></span>
        <span style="display: flex; gap: 2px; height: 6px">
          <sc-for list="{{r.bar}}" as="b" hint-placeholder-count="4"><span style="flex: {{b.f}}; border-radius: 3px; background: {{b.c}}"></span></sc-for>
        </span>
        <span style="font-size: 12px; color: #9AA0AA">{{r.sub}}</span>
      </div>
    </sc-for>
  </div>
  <div style="padding: 8px 20px; font-size: 12px; color: #6E747E">{{note}}</div>
  <nav style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 8px 18px; border-top: 1px solid #23262C; background: #16181C">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <span style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.color}}; font-size: 13px; font-weight: {{t.fw}}">
        <span style="width: 60px; height: 32px; border-radius: 16px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg>
        </span>{{t.label}}
      </span>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"part":{"editor":"enum","options":["Intervals","Gym"],"default":"Intervals"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const gym = (this.props.part ?? 'Intervals') === 'Gym';
    const seg = ['Intervals', 'Gym'].map((t, i) => ({ t, bg: (i === 1) === gym ? '#7C3AED' : 'transparent', fg: (i === 1) === gym ? '#FFFFFF' : '#9AA0AA' }));
    const P = '#E91E63', Y = '#FFC107', T = '#00BFA5', G = '#8BC34A', B = '#5B8DEF', O = '#FF8A50';
    const bar = (arr) => arr.map(([f, c]) => ({ f, c }));
    const rows = gym ? [
      { name: 'Today', right: '10 sets', sub: 'Deep Squat · Overhead Press', bar: bar([[5, G], [4, O]]) },
      { name: 'Groups', right: '5', sub: 'Legs · Shoulders · Pull · Fingers · One-arm', bar: bar([[1, G], [1, O], [1, B], [1, '#C8A97E'], [1, '#90A4AE']]) },
      { name: 'Exercises', right: '65', sub: 'A–Z, search, history, graphs, records', bar: bar([]) },
      { name: 'Days', right: '275', sub: 'every gym day, swipe left for older', bar: bar([]) }
    ] : [
      { name: 'hangboard 70%', right: '5:25', sub: 'fingers · 4 rounds · 1:00 between', bar: bar([[5, P], [5, Y], [5, P], [5, Y], [5, P], [5, Y], [5, P]]) },
      { name: 'block pulls 60%', right: '9:53', sub: 'fingers · 4 rounds · 2:00 between', bar: bar([[5, '#9C27B0'], [2, T], [5, P], [3, Y], [5, '#9C27B0'], [2, T], [5, P]]) },
      { name: 'max hang 20mm', right: '26:29', sub: 'fingers · 2 rounds · 5:00 between', bar: bar([[7, '#FF5722'], [120, '#00BCD4'], [7, '#FF5722']]) },
      { name: 'hiit', right: '7:35', sub: 'hiit · 4 rounds · 0:30 between', bar: bar([[30, '#F44336'], [10, G], [30, '#F44336']]) }
    ];
    const I = {
      today: 'M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8',
      train: 'M4 8h4l3 8 3-12 3 8h3',
      journal: 'M3.5 7.5a2.5 2.5 0 0 1 2.5-2.5h12a2.5 2.5 0 0 1 2.5 2.5v10a2.5 2.5 0 0 1-2.5 2.5h-12a2.5 2.5 0 0 1-2.5-2.5zM3.5 10h17M8 3v4M16 3v4'
    };
    const tab = (label, d, on) => ({ label, d, color: on ? '#C4B1FF' : '#9AA0AA', bg: on ? '#2A2340' : 'transparent', fw: on ? 700 : 600 });
    return {
      seg, rows,
      tabs: [tab('Today', I.today), tab('Train', I.train, true), tab('Journal', I.journal)],
      note: gym ? 'F · Train → Gym: today, your groups, all exercises, past days.' : 'F · Train → Intervals: your workout list (edit, start). The switch remembers your last choice.'
    };
  }
}
</script>
</body>
</html>
