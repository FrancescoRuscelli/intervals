<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7C3AED}a:hover{color:#6D28D9}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 4px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Settings</h1>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 10px 16px 16px">
    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Appearance</h2>
      <div style="border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; padding: 4px 14px">
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px">
          <span style="font-size: 15px">Theme</span>
          <div role="group" aria-label="Theme" style="display: flex; padding: 3px; border-radius: 10px; background: {{t.bg}}">
            <button aria-pressed="true" style="height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: {{t.accent}}; color: #FFFFFF; font-size: 13px; font-weight: 600">System</button>
            <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: {{t.muted}}; font-size: 13px; font-weight: 600">Light</button>
            <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: {{t.muted}}; font-size: 13px; font-weight: 600">Dark</button>
          </div>
        </div>
        <div style="height: 1px; background: {{t.line}}"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px">
          <span style="font-size: 15px">Accent color</span>
          <div style="display: flex; gap: 8px">
            <sc-for list="{{accents}}" as="a" hint-placeholder-count="5">
              <button aria-label="Accent {{a.name}}" style="width: 30px; height: 30px; padding: 0; border-radius: 15px; background: {{a.hex}}; border: {{a.ring}}"></button>
            </sc-for>
          </div>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Sound</h2>
      <div style="border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; padding: 4px 14px">
        <label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px"><span style="font-size: 15px">Say series names</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{t.accent}}"></label>
        <div style="height: 1px; background: {{t.line}}"></div>
        <button style="width: 100%; display: flex; align-items: center; justify-content: space-between; min-height: 52px; border: 0; padding: 0; background: transparent; color: {{t.text}}; font-size: 15px; text-align: left"><span>Voice language</span><span style="color: {{t.muted}}">English ›</span></button>
        <div style="height: 1px; background: {{t.line}}"></div>
        <label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px"><span style="font-size: 15px">Beep the last 3 seconds</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{t.accent}}"></label>
        <div style="height: 1px; background: {{t.line}}"></div>
        <label style="display: flex; flex-direction: column; justify-content: center; gap: 6px; min-height: 64px"><span style="font-size: 15px">Volume</span><input type="range" value="80" style="width: 100%; accent-color: {{t.accent}}"></label>
        <div style="height: 1px; background: {{t.line}}"></div>
        <label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px"><span style="font-size: 15px">Lower music during cues</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{t.accent}}"></label>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Player</h2>
      <div style="border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; padding: 4px 14px">
        <label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px"><span style="font-size: 15px">3-2-1 countdown before start</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{t.accent}}"></label>
        <div style="height: 1px; background: {{t.line}}"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 60px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 15px">Disc animation</span><span style="font-size: 12px; color: {{t.muted}}">At every new series</span></span>
          <div role="group" aria-label="Disc animation" style="display: flex; flex: none; padding: 3px; border-radius: 10px; background: {{t.bg}}">
            <button aria-pressed="true" style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: {{t.accent}}; color: #FFFFFF; font-size: 13px; font-weight: 600">Calm</button>
            <button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: {{t.muted}}; font-size: 13px; font-weight: 600">Crazy spin</button>
          </div>
        </div>
        <div style="height: 1px; background: {{t.line}}"></div>
        <label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px"><span style="font-size: 15px">Keep screen on</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{t.accent}}"></label>
        <div style="height: 1px; background: {{t.line}}"></div>
        <label style="display: flex; align-items: center; justify-content: space-between; min-height: 52px"><span style="display: flex; flex-direction: column"><span style="font-size: 15px">Lock controls</span><span style="font-size: 12px; color: {{t.muted}}">Hold the pause button to unlock</span></span><input type="checkbox" style="width: 22px; height: 22px; accent-color: {{t.accent}}"></label>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Data</h2>
      <div style="border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; padding: 4px 14px">
        <a href="Import.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; color: {{t.text}}; text-decoration: none; font-size: 15px"><span>Import from Hybrid Interval Timer</span><span style="color: {{t.muted}}">›</span></a>
        <div style="height: 1px; background: {{t.line}}"></div>
        <button style="width: 100%; display: flex; align-items: center; justify-content: space-between; min-height: 56px; border: 0; padding: 0; background: transparent; color: {{t.text}}; text-align: left"><span style="display: flex; flex-direction: column"><span style="font-size: 15px">Back up to a file</span><span style="font-size: 12px; color: {{t.muted}}">Workouts and journal · last: never</span></span><span style="color: {{t.muted}}">›</span></button>
        <div style="height: 1px; background: {{t.line}}"></div>
        <button style="width: 100%; display: flex; align-items: center; justify-content: space-between; min-height: 52px; border: 0; padding: 0; background: transparent; color: {{t.text}}; font-size: 15px; text-align: left"><span>Restore from a file</span><span style="color: {{t.muted}}">›</span></button>
      </div>
    </section>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 18px; border-top: 1px solid {{t.line}}; background: {{t.sheet}}">
    <a href="Main.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Workouts
    </a>
    <a href="GymVisual3.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Journal
    </a>
    <a href="Stats.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.muted}}; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20v-8M12 20V5M19 20v-5"></path></svg>Stats
    </a>
    <a href="Settings.dc.html" aria-current="page" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.accentText}}; text-decoration: none; font-size: 12px; font-weight: 700">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: {{t.tint}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
      </span>Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = { bg: '#000000', surface: '#1A1C21', sheet: '#16181C', line: '#23262C', text: '#F2F3F5', muted: '#9AA0AA', accent: '#7C3AED', accentText: '#C4B1FF', tint: '#2A2340', sel: '#F2F3F5' };
    const light = { bg: '#F6F5FA', surface: '#FFFFFF', sheet: '#FFFFFF', line: '#E2E0EA', text: '#17151F', muted: '#5E5A6B', accent: '#6D28D9', accentText: '#5B21B6', tint: '#EDE7FB', sel: '#17151F' };
    const t = (this.props.mode ?? 'dark') === 'light' ? light : dark;
    const list = [['purple', '#7C3AED'], ['pink', '#D81B60'], ['teal', '#00897B'], ['blue', '#2563EB']];
    return { t, accents: list.map(([name, hex], i) => ({ name, hex, ring: i === 0 ? '3px solid ' + t.sel : '3px solid transparent' })) };
  }
}
</script>
</body>
</html>
