<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym stats and records</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
.ranking-modes{display:flex;gap:2px;border:1px solid #2A2D34;border-radius:12px;padding:2px}
.ranking-modes button{min-width:48px;min-height:48px;border:0;border-radius:9px;padding:0 8px;background:transparent;color:#9AA0AA;font-size:12px;font-weight:600;cursor:pointer}
.ranking-modes button[aria-pressed="true"]{background:#C4B1FF;color:#1C1237}
.ranking-group{margin:12px 0 0;color:#9AA0AA;font-size:12px;font-weight:600}
.ranking-row{margin-top:10px}
.ranking-metrics{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px;color:#9AA0AA;font-size:12px}
.ranking-metrics strong{color:#F2F3F5;font-size:18px;font-weight:600}
.ranking-track{height:8px;margin-top:4px;border-radius:4px;background:#23262C}
.ranking-bar{height:100%;border-radius:inherit;background:#E91E63}
</style>
</helmet>
<div style="width: 390px; height: 1250px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 4px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Stats</h1>
  </header>
  <div role="tablist" style="display: flex; gap: 6px; padding: 8px 16px 0">
    <button role="tab" aria-selected="false" style="flex: 1; height: 38px; border: 0; border-radius: 12px; background: transparent; color: #9AA0AA; font-size: 14px; font-weight: 600">Intervals</button>
    <button role="tab" aria-selected="true" style="flex: 1; height: 38px; border: 0; border-radius: 12px; background: #2A2340; color: #C4B1FF; font-size: 14px; font-weight: 700">Gym</button>
    <button role="tab" aria-selected="false" style="flex: 1; height: 38px; border: 0; border-radius: 12px; background: transparent; color: #9AA0AA; font-size: 14px; font-weight: 600">Both</button>
  </div>

  <section style="margin: 14px 16px 0; padding: 14px 14px 8px; border-radius: 18px; background: #1A1C21">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Gym days per week</h2>
      <span style="font-size: 12px; color: #9AA0AA">last 12 weeks · avg 3.6</span>
    </div>
    <svg role="img" aria-label="Gym days per week, last 12 weeks: {{weeksLabel}}" width="330" height="130" viewBox="0 0 330 130" style="display: block; margin-top: 8px">
      <sc-for list="{{grid}}" as="g" hint-placeholder-count="3">
        <line x1="18" x2="330" y1="{{g.y}}" y2="{{g.y}}" stroke="#2A2D34" stroke-width="1"></line>
        <text x="0" y="{{g.ty}}" font-size="10" fill="#9AA0AA" font-family="Inter, sans-serif">{{g.label}}</text>
      </sc-for>
      <line x1="18" x2="330" y1="108" y2="108" stroke="#3A3E46" stroke-width="1"></line>
      <sc-for list="{{weeks}}" as="b" hint-placeholder-count="12">
        <path d="{{b.d}}" fill="{{b.fill}}"></path>
        <text x="{{b.cx}}" y="124" text-anchor="middle" font-size="10" fill="#9AA0AA" font-family="Inter, sans-serif">{{b.label}}</text>
      </sc-for>
    </svg>
  </section>

  <section style="margin: 12px 16px 0; padding: 12px 14px; border-radius: 18px; background: #1A1C21; display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Recent records</h2>
      <span style="font-size: 12px; color: #9AA0AA">all ›</span>
    </div>
    <sc-for list="{{records}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-bottom: 1px solid #23262C">
        <span style="width: 30px; height: 30px; border-radius: 15px; background: #FFC107; color: #1A1200; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">PR</span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">{{r.name}}</span><span style="font-size: 12px; color: #9AA0AA">{{r.when}}</span></span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 16px; font-weight: 700">{{r.v}}</span>
      </div>
    </sc-for>
  </section>

  <section style="margin: 12px 16px 0; padding: 14px; border-radius: 18px; background: #1A1C21">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Most trained</h2>
      <div class="ranking-modes" role="group" aria-label="Rank exercises by">
        <sc-for list="{{modes}}" as="mode" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{mode.pressed}}" onClick="{{mode.pick}}">{{mode.label}}</button>
        </sc-for>
      </div>
    </div>
    <sc-for list="{{ranking}}" as="group" hint-placeholder-count="1">
      <sc-if value="{{group.title}}" hint-placeholder-val="{{ false }}">
        <h3 class="ranking-group">{{group.title}}</h3>
      </sc-if>
      <sc-for list="{{group.rows}}" as="t" hint-placeholder-count="5">
        <div class="ranking-row">
          <div style="font-size:14px">{{t.name}}</div>
          <div class="ranking-metrics"><strong>{{t.primary}}</strong><span>· {{t.secondary}}</span></div>
          <div class="ranking-track" aria-hidden="true"><div class="ranking-bar" style="width: {{t.width}}"></div></div>
        </div>
      </sc-for>
    </sc-for>
  </section>

  <section style="margin: 12px 16px 0; padding: 12px 14px; border-radius: 18px; border: 1px solid #23262C; display: flex; gap: 12px; align-items: center">
    <span style="width: 36px; height: 36px; flex: none; border-radius: 18px; background: #2A2340; color: #C4B1FF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-5 4 4 7-7"></path></svg></span>
    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Deadlift: top weight 120 kg since February</span><span style="font-size: 12px; color: #9AA0AA">but 120 × 5 on 28 Oct was your best set (1RM est. 140) · a fact, no advice</span></span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [['24 Aug', 3], ['', 2], ['', 6], ['', 3], ['', 2], ['', 5], ['', 3], ['', 5], ['', 2], ['', 3], ['', 5], ['9 Nov', 4]];
    const base = 108, top = 8, max = 6, x0 = 24, slot = 25.5, bw = 18, r = 4;
    const yOf = (v) => base - (v / max) * (base - top);
    const weeks = data.map(([label, v], i) => {
      const x = x0 + i * slot, y = yOf(v);
      const d = 'M' + x + ' ' + base + ' V' + (y + r) + ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + ' H' + (x + bw - r) + ' Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + r) + ' V' + base + ' Z';
      return { d, label, cx: x + bw / 2, fill: i === data.length - 1 ? '#7C3AED' : '#4C3A80' };
    });
    const grid = [2, 4, 6].map((v) => ({ y: yOf(v), ty: yOf(v) + 3, label: String(v) }));
    const metric = this.state?.metric || 'sets';
    const options = [['sets', 'Sets'], ['days', 'Days'], ['work', 'Reps']];
    const exercises = [
      { name: 'Barbell Deep Squat', sets: 598, days: 54, work: 2900 },
      { name: 'Pull Up', sets: 426, days: 67, work: 3168 },
      { name: 'Deadlift', sets: 204, days: 38, work: 850 },
      { name: 'Dead Hang', sets: 157, days: 46, work: 5921, timed: true },
      { name: 'Tuck Hold', sets: 89, days: 26, work: 2440, timed: true }
    ];
    const display = (e, key) => {
      const n = e[key];
      if (key === 'work' && e.timed) return Math.floor(n / 60) + ' min ' + (n % 60) + ' s';
      return n.toLocaleString('en') + ' ' + (key === 'work' ? 'reps' : key);
    };
    const groups = metric === 'work'
      ? [['Reps', exercises.filter((e) => !e.timed)], ['Time', exercises.filter((e) => e.timed)]]
      : [['', exercises]];
    const ranking = groups.map(([title, group]) => {
      group.sort((a, b) => b[metric] - a[metric]);
      return {
        title,
        rows: group.map((e) => ({
          name: e.name,
          primary: display(e, metric),
          secondary: options.map(([key]) => key).filter((key) => key !== metric).map((key) => display(e, key)).join(' · '),
          width: (100 * e[metric] / group[0][metric]) + '%'
        }))
      };
    });
    return {
      weeks, grid, weeksLabel: data.map((d) => d[1]).join(', '),
      ranking,
      modes: options.map(([key, label]) => ({
        label, pressed: String(key === metric), pick: () => this.setState({ metric: key })
      })),
      records: [
        { name: 'Barbell Deep Squat', when: 'today', v: '85 × 3' },
        { name: 'Pull Up', when: 'Sun 15', v: '+30 × 5' },
        { name: 'Pistol Squat (L)', when: 'Wed 11', v: '🟢🟣🔴 × 5' },
        { name: 'Box Pike Push Up', when: 'Fri 13', v: '6 reps' }
      ]
    };
  }
}
</script>
</body>
</html>
