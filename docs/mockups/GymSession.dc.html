<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym, group in progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 4px 20px">
    <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #9AA0AA">Group · started 18:05</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700">Legs</span></span>
    <span style="display: flex; align-items: center; gap: 4px">
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; color: #C9CDD3">38:12</span>
      <button aria-label="More" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
    </span>
  </header>

  <div aria-label="Progress: 7 of 13 planned sets" style="display: flex; gap: 4px; padding: 6px 20px 0">
    <sc-for list="{{bar}}" as="b" hint-placeholder-count="13">
      <span style="flex: 1; height: 6px; border-radius: 3px; background: {{b.c}}"></span>
    </sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 0">
    <sc-for list="{{items}}" as="e" hint-placeholder-count="3">
      <a href="GymExercise.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 14px 14px; border-radius: 20px; background: {{e.bg}}; border: 2px solid {{e.border}}; color: inherit; text-decoration: none">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 32px; height: 32px; flex: none; border-radius: 16px; background: {{e.numBg}}; color: {{e.numFg}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{e.num}}</span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">{{e.name}}</span><span style="font-size: 12px; color: #9AA0AA">{{e.sub}}</span></span>
          <span style="font-size: 13px; font-weight: 700; color: {{e.stateFg}}">{{e.state}}</span>
        </div>
        <sc-if value="{{e.hasSets}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-left: 44px; ">
            <sc-for list="{{e.sets}}" as="s" hint-placeholder-count="3">
              <span style="height: 46px; min-width: 0; border-radius: 11px; background: {{s.bg}}; color: {{s.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 10px; font-weight: 700; opacity: 0.75">{{s.lab}}</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 14px; font-weight: 600; white-space: nowrap">{{s.val}}</span></span>
            </sc-for>
          </div>
        </sc-if>
      </a>
    </sc-for>
    <button style="height: 48px; border: 2px dashed #2A2D34; border-radius: 16px; background: transparent; color: #C4B1FF; font-size: 14px; font-weight: 600">+ Add an exercise just for today</button>
  </div>

  <div role="timer" aria-label="{{r.aria}}" style="margin: 10px 16px 0; border-radius: 18px; overflow: hidden; background: {{r.bg}}; color: {{r.fg}}">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 0 8px 0 14px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">{{r.title}}</span><span style="font-size: 12px; opacity: 0.8">{{r.sub}}</span></span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.time}}</span>
      <button aria-label="Stop the rest clock" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(127,127,127,0.18); color: inherit; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="height: 4px; background: rgba(127,127,127,0.25)"><div style="width: {{r.pct}}; height: 4px; background: {{r.line}}"></div></div>
  </div>

  <div style="display: flex; gap: 10px; padding: 12px 16px 26px">
    <a href="GymExercise.dc.html" style="flex: 1; height: 58px; border-radius: 18px; background: #7C3AED; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Go to Deadlift</a>
    <a href="GymFinish.dc.html" style="height: 58px; padding: 0 20px; border-radius: 18px; background: #1A1C21; color: #F2F3F5; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Finish</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rest":{"editor":"enum","options":["counting","past the target"],"default":"counting"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this._vals();
    const cells = (arr) => arr.map((s, i) => {
      let t = s.text ?? s.t, tag = '';
      if (t.endsWith(' ✓')) { t = t.slice(0, -2); tag = ' ✓'; }
      if (t.endsWith(' PR')) { t = t.slice(0, -3); tag = ' · PR'; }
      let lab = String(i + 1);
      const m = t.match(/^([LR]) (.*)$/);
      if (m) { lab = m[1]; t = m[2]; }
      return Object.assign({}, s, { lab: lab + tag, val: t.replace(' kg', '') });
    });
    v.items.forEach((e) => { e.sets = cells(e.sets); });
    return v;
  }
  _vals() {
    const restMode = this.props.rest ?? 'counting';
    const after = restMode !== 'counting';
    const r = after
      ? { bg: '#00BFA5', fg: '#04221E', line: '#04221E', pct: '100%', time: '3:25', title: 'Ready · 3:00 passed (buzzed)', sub: 'still counting, so you know how long you rested', icon: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4', aria: 'Rest 3 minutes 25 seconds, past the 3 minute target' }
      : { bg: '#0E3B35', fg: '#E6FFFA', line: '#00BFA5', pct: '70%', time: '2:07', title: 'Resting · next: Deadlift set 3', sub: 'counts up · buzz at 3:00', icon: 'M12 8v5l3 2M12 3.5a9 9 0 1 0 0 18a9 9 0 0 0 0-18', aria: 'Rest 2 minutes 7 seconds, buzz at 3 minutes' };
    const done = (t) => ({ t: t + ' ✓', bg: '#3A1428', fg: '#FF8AB3' });
    const pr = (t) => ({ t: t + ' PR', bg: '#FFC107', fg: '#1A1200' });
    const todo = (t) => ({ t, bg: '#23262C', fg: '#9AA0AA' });
    const bar = [];
    for (let i = 0; i < 13; i++) bar.push({ c: i < 7 ? '#E91E63' : i === 7 ? '#7C3AED' : '#23262C' });
    return {
      bar, r,
      items: [
        { num: '✓', name: 'Barbell Deep Squat', sub: '5 sets · 80 kg', state: 'done', stateFg: '#FF8AB3', bg: '#0B0C0E', border: '#0B0C0E', numBg: '#3A1428', numFg: '#FF8AB3', hasSets: true,
          sets: [done('80 × 5'), done('80 × 5'), done('80 × 5'), done('80 × 5'), pr('85 × 3')] },
        { num: '2', name: 'Deadlift', sub: 'plan 4 sets · last 110 × 5, 5, 3', state: 'now', stateFg: '#C4B1FF', bg: '#1A1C21', border: '#7C3AED', numBg: '#7C3AED', numFg: '#FFFFFF', hasSets: true,
          sets: [done('110 × 5'), done('110 × 5'), todo('110 × 5'), todo('110 × 5')] },
        { num: '3', name: 'Bulgarian Bar Squat', sub: 'plan 4 sets · per side · last 70 × 5', state: 'next', stateFg: '#9AA0AA', bg: '#1A1C21', border: '#1A1C21', numBg: '#23262C', numFg: '#C9CDD3', hasSets: true,
          sets: [todo('L 70 × 5'), todo('R 70 × 5'), todo('L 70 × 5'), todo('R 70 × 5')] }
      ]
    };
  }
}
</script>
</body>
</html>
