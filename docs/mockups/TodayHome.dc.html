<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today, the home tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; padding: 16px 10px 4px 20px">
    <span style="flex: 1; display: flex; flex-direction: column">
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700">Today</span>
      <span style="font-size: 13px; color: #9AA0AA">Wednesday 18 November</span>
    </span>
    <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a3 3 0 1 0 0 6a3 3 0 0 0 0-6M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg></span>
  </header>

  <!-- this week: tap a day = that day in the Journal -->
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 8px 16px 0">
    <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
      <div style="height: 58px; border-radius: 14px; background: {{d.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
        <span style="font-size: 11px; color: #9AA0AA">{{d.wd}}</span>
        <span style="font-size: 15px; font-weight: 700; color: {{d.fg}}">{{d.n}}</span>
        <span style="display: flex; gap: 1px; width: 26px; height: 4px; border-radius: 2px; overflow: hidden">
          <sc-for list="{{d.strip}}" as="s" hint-placeholder-count="2"><span style="flex: {{s.f}}; background: {{s.c}}"></span></sc-for>
        </span>
      </div>
    </sc-for>
  </div>

  <!-- start -->
  <div style="display: flex; gap: 10px; padding: 16px 16px 0">
    <div style="flex: 1; height: 92px; border-radius: 20px; background: #7C3AED; color: #FFFFFF; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5l3 2M9 2h6M12 4a9 9 0 1 0 0 18a9 9 0 0 0 0-18"></path></svg>
      <span style="font-size: 17px; font-weight: 700">Intervals ▶</span>
    </div>
    <div style="flex: 1; height: 92px; border-radius: 20px; background: #E91E63; color: #14080C; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>
      <span style="font-size: 17px; font-weight: 700">Gym ▶</span>
    </div>
  </div>

  <!-- quick start: what you do most / last -->
  <div style="padding: 16px 20px 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #9AA0AA">Quick start</div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px">
    <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 8px 0 12px; border-radius: 16px; background: #1A1C21">
        <span style="width: 6px; height: 30px; border-radius: 3px; background: {{q.c}}"></span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{q.name}}</span><span style="font-size: 12px; color: #9AA0AA">{{q.sub}}</span></span>
        <span style="width: 40px; height: 40px; border-radius: 20px; background: {{q.btn}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"></path></svg></span>
      </div>
    </sc-for>
  </div>

  <!-- done today -->
  <div style="padding: 16px 20px 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #9AA0AA">Done today</div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px">
    <sc-for list="{{done}}" as="x" hint-placeholder-count="2">
      <div style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #1A1C21">
        <span style="width: 5px; border-radius: 3px; background: {{x.c}}"></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 700">{{x.t}}</span><span style="font-size: 12px; color: #9AA0AA">{{x.r}}</span></span>
          <span style="font-size: 13px; color: #C9CDD3">{{x.s}}</span>
        </span>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 8px 20px; font-size: 12px; color: #6E747E">{{note}}</div>
  <nav style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); padding: 8px 8px 18px; border-top: 1px solid #23262C; background: #16181C">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <span style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{t.color}}; font-size: 13px; font-weight: {{t.fw}}">
        <span style="width: 60px; height: 32px; border-radius: 16px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg>
        </span>{{t.label}}
      </span>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["D 4 tabs","E 2 tabs"],"default":"D 4 tabs"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'D 4 tabs';
    const I = {
      today: 'M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8',
      timer: 'M12 8v5l3 2M9 2h6M12 4a9 9 0 1 0 0 18a9 9 0 0 0 0-18',
      gym: 'M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12',
      journal: 'M3.5 7.5a2.5 2.5 0 0 1 2.5-2.5h12a2.5 2.5 0 0 1 2.5 2.5v10a2.5 2.5 0 0 1-2.5 2.5h-12a2.5 2.5 0 0 1-2.5-2.5zM3.5 10h17M8 3v4M16 3v4'
    };
    const tab = (label, d, on) => ({ label, d, color: on ? '#C4B1FF' : '#9AA0AA', bg: on ? '#2A2340' : 'transparent', fw: on ? 700 : 600 });
    const G = '#8BC34A', B = '#5B8DEF', O = '#FF8A50', P = '#E91E63';
    const week = [
      ['Mo', 16, []], ['Tu', 17, [[13, G], [3, G], [4, G]]], ['We', 18, [[5, G], [4, O], [1, P]], true],
      ['Th', 19, []], ['Fr', 20, []], ['Sa', 21, []], ['Su', 22, []]
    ].map(([wd, n, strip, today]) => ({
      wd, n, strip: strip.map(([f, c]) => ({ f, c })),
      bg: today ? '#2A2340' : '#111216', fg: n > 18 ? '#4A4F58' : '#F2F3F5'
    }));
    const D = v.startsWith('D');
    return {
      week,
      quick: [
        { name: 'Legs', sub: 'gym group · last Tue · Deep Squat, Deadlift, Bulgarian', c: G, btn: '#E91E63' },
        { name: 'hangboard 70%', sub: 'intervals · 5:25 · last Mon', c: P, btn: '#7C3AED' },
        { name: 'Shoulders', sub: 'gym group · last Fri', c: O, btn: '#E91E63' }
      ],
      done: [
        { t: 'Gym · Legs · Shoulders', r: '10 sets · 1 PR', s: 'Deep Squat 80 × 5 ×4 · Overhead Press 40 × 5 ×4', c: G },
        { t: 'Intervals · hangboard 70%', r: '5:25 · completed', s: 'hang · Load L +12.5 · R +10 kg', c: P }
      ],
      tabs: D ? [tab('Today', I.today, true), tab('Intervals', I.timer), tab('Gym', I.gym), tab('Journal', I.journal)]
              : [tab('Today', I.today, true), tab('Journal', I.journal)],
      cols: D ? 4 : 2,
      note: D ? 'D · Today is home: start, quick start, what you did. Intervals and Gym tabs keep the full lists. Journal has Stats inside. ⚙ top right.'
              : 'E · only Today and Journal. "Intervals ▶" opens your workout list, "Gym ▶" the gym day (groups, exercises). ⚙ top right.'
    };
  }
}
</script>
</body>
</html>
