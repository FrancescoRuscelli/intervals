<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym, sets during a workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 8px 0">
    <button aria-label="Back" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 22px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 17px; font-weight: 700">Block Pulls</span>
      <span style="font-size: 12px; color: #9AA0AA">Last · Tue · R 50 × 5 · L 45 × 5</span>
    </span>
    <span style="width: 44px; flex: none"></span>
  </header>

  <div role="group" aria-label="Side" style="display: flex; align-self: center; margin-top: 12px; padding: 3px; border-radius: 12px; background: #1A1C21">
    <button aria-pressed="true" style="width: 74px; height: 34px; border: 0; border-radius: 9px; background: #F2F3F5; color: #000000; font-size: 14px; font-weight: 700">Left</button>
    <button aria-pressed="false" style="width: 74px; height: 34px; border: 0; border-radius: 9px; background: transparent; color: #9AA0AA; font-size: 14px; font-weight: 700">Right</button>
    <button aria-pressed="false" style="width: 74px; height: 34px; border: 0; border-radius: 9px; background: transparent; color: #9AA0AA; font-size: 14px; font-weight: 700">Both</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 16px 0">
    <div style="padding: 10px 10px 10px; border-radius: 20px; background: #1A1C21; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font-size: 12px; color: #9AA0AA; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">Weight</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 40px; font-weight: 700; line-height: 1">47<span style="font-size: 15px; color: #9AA0AA; margin-left: 4px">kg</span></span>
      <span style="display: flex; gap: 8px; width: 100%">
        <button aria-label="Weight minus 1" style="flex: 1; height: 42px; border: 0; border-radius: 14px; background: #2A2340; color: #C4B1FF; font-size: 22px; font-weight: 700">−</button>
        <button aria-label="Weight plus 1" style="flex: 1; height: 42px; border: 0; border-radius: 14px; background: #2A2340; color: #C4B1FF; font-size: 22px; font-weight: 700">+</button>
      </span>
    </div>
    <div style="padding: 10px 10px 10px; border-radius: 20px; background: #1A1C21; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font-size: 12px; color: #9AA0AA; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">Reps</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 40px; font-weight: 700; line-height: 1">3</span>
      <span style="display: flex; gap: 8px; width: 100%">
        <button aria-label="Reps minus 1" style="flex: 1; height: 42px; border: 0; border-radius: 14px; background: #2A2340; color: #C4B1FF; font-size: 22px; font-weight: 700">−</button>
        <button aria-label="Reps plus 1" style="flex: 1; height: 42px; border: 0; border-radius: 14px; background: #2A2340; color: #C4B1FF; font-size: 22px; font-weight: 700">+</button>
      </span>
    </div>
  </div>

  <div style="display: flex; gap: 10px; padding: 12px 16px 0">
    <button style="flex: 1; height: 56px; border: 0; border-radius: 18px; background: #7C3AED; color: #FFFFFF; font-size: 17px; font-weight: 700">Log set · L</button>
  </div>

  <div role="timer" aria-label="Resting 1 minute 12 seconds" style="align-self: center; margin-top: 10px; height: 30px; padding: 0 14px; border-radius: 15px; background: #0E3B35; color: #5EEAD4; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
    <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 15px">1:12</span>
    <span style="color: #8FD9CC">resting · buzz at 2:00</span>
  </div>

  <section aria-label="Sets today" style="flex: 1; overflow: hidden; margin-top: 12px; padding: 0 16px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #9AA0AA">Sets · 11</span>
      <span style="font-size: 12px; color: #6E747E">{{hint}}</span>
    </div>

    <sc-if value="{{isA}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: 44px 1fr 1fr 34px; align-items: center; padding: 4px 4px; font-size: 12px; font-weight: 700; color: #9AA0AA">
        <span></span><span>L</span><span>R</span><span></span>
      </div>
      <sc-for list="{{pairs}}" as="r" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 44px 1fr 1fr 34px; align-items: center; min-height: 46px; padding: 0 4px; border-bottom: 1px solid #16181C">
          <span style="font-size: 13px; color: #9AA0AA; font-family: 'Space Grotesk', Inter, sans-serif">{{r.n}}</span>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 600; color: {{r.lfg}}">{{r.l}}</span>
          <span style="display: flex; flex-direction: column">
            <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 600; color: {{r.rfg}}">{{r.r}}</span>
            <sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #9AA0AA; font-style: italic">{{r.note}}</span></sc-if>
          </span>
          <span style="font-size: 13px; font-weight: 800; color: #E91E63; text-align: right">{{r.k}}</span>
        </div>
      </sc-for>
    </sc-if>

    <sc-if value="{{isB}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 4px; border-bottom: 1px solid #16181C">
          <span style="width: 22px; height: 22px; flex: none; border-radius: 11px; background: #2A2340; color: #C4B1FF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{b.side}}</span>
          <span style="width: 70px; flex: none; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 700">{{b.load}}</span>
          <span style="flex: 1; display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{b.reps}}" as="x" hint-placeholder-count="3">
              <span style="min-width: 30px; height: 30px; padding: 0 6px; box-sizing: border-box; border-radius: 9px; background: #1A1C21; border: 1px solid {{x.edge}}; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 15px; font-weight: 600">{{x.v}}</span>
            </sc-for>
          </span>
        </div>
      </sc-for>
      <span style="padding: 8px 4px 0; font-size: 12px; color: #9AA0AA">pink edge = has a note · tap a number for that set</span>
    </sc-if>

    <sc-if value="{{isC}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{newest}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 4px; border-bottom: 1px solid #16181C">
          <span style="width: 34px; flex: none; font-size: 13px; color: #9AA0AA; font-family: 'Space Grotesk', Inter, sans-serif">{{r.n}}</span>
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 600">{{r.text}}</span>
            <sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #9AA0AA; font-style: italic">{{r.note}}</span></sc-if>
          </span>
          <span style="font-size: 13px; font-weight: 800; color: #E91E63">{{r.k}}</span>
          <span style="font-size: 12px; color: #6E747E">{{r.rest}}</span>
        </div>
      </sc-for>
      <button style="margin-top: 8px; height: 40px; border: 0; border-radius: 12px; background: #1A1C21; color: #C4B1FF; font-size: 14px; font-weight: 600">+ 2 earlier</button>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"layout":{"editor":"enum","options":["A side by side","B blocks by load","C folded, newest on top"],"default":"A side by side"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const layout = this.props.layout ?? 'A side by side';
    // pairs of the session (R then L), folded when identical
    const pairs = [
      { n: '1–2', l: '45 × 5', r: '50 × 5', k: '×2', note: '' },
      { n: '3', l: '45 × 4', r: '50 × 5', k: '', note: 'senza mignolo' },
      { n: '4–5', l: '47 × 3', r: '52 × 3', k: '×2', note: '' },
      { n: '6', l: '–', r: '52 × 2', k: '', note: '' }
    ].map((r) => Object.assign(r, { lfg: r.l === '–' ? '#4A4F58' : '#F2F3F5', rfg: '#F2F3F5' }));
    const rep = (v, note) => ({ v, edge: note ? '#E91E63' : '#2A2D34' });
    const blocks = [
      { side: 'R', load: '50 kg', reps: [rep('5'), rep('5'), rep('5', true)] },
      { side: 'L', load: '45 kg', reps: [rep('5'), rep('5'), rep('4')] },
      { side: 'R', load: '52 kg', reps: [rep('3'), rep('3'), rep('2')] },
      { side: 'L', load: '47 kg', reps: [rep('3'), rep('3')] }
    ];
    const newest = [
      { n: '6', text: 'R 52 × 2', k: '', rest: 'rested 2:05', note: '' },
      { n: '4–5', text: 'L 47 × 3 · R 52 × 3', k: '×2', rest: '', note: '' },
      { n: '3', text: 'L 45 × 4 · R 50 × 5', k: '', rest: '', note: 'R: senza mignolo' },
      { n: '2', text: 'L 45 × 5 · R 50 × 5', k: '', rest: '', note: '' }
    ];
    const hint = layout.startsWith('A') ? 'one row = R and L of the same set' : layout.startsWith('B') ? 'one row per side and weight' : 'newest first';
    return {
      pairs, blocks, newest, hint,
      isA: layout.startsWith('A'), isB: layout.startsWith('B'), isC: layout.startsWith('C')
    };
  }
}
</script>
</body>
</html>
